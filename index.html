document.addEventListener('submit', async function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const fd = new FormData(form);

  if(type==='analyst'){
    const name = fd.get('name').trim(); const color = fd.get('color');
    const id = form.dataset.id;
    if(id){ const a=getAnalyst(id); if(a){ a.name=name; a.color=color; const b=boardOfAnalyst(id); if(b) b.name='Quadro — '+name; } }
    else { createAnalyst(name, color); }
    ui.modal=null; render();
  }
  else if(type==='client'){
    const data = {name: fd.get('name').trim(), contact: fd.get('contact').trim(), email: fd.get('email').trim(), phone: fd.get('phone').trim(), segment: fd.get('segment').trim(), city: fd.get('city').trim(), clientType: fd.get('clientType')||'novo'};
    const id = form.dataset.id;
    if(id) updateClient(id, data); else createClient(data);
    ui.modal=null; render();
  }
  else if(type==='list-new'){
    addList(form.dataset.board, fd.get('name').trim());
    ui.modal=null; render();
  }
  else if(type==='card-new'){
    let clientId = fd.get('clientId');
    if(!clientId){
      const newName = (fd.get('newClientName')||'').trim();
      if(!newName){ showAlert('Selecione um cliente existente ou informe o nome do novo cliente.'); return; }
      clientId = createClient({name:newName}).id;
    }
    const card = createCard(form.dataset.board, form.dataset.list, clientId, {
      contractedHours: parseFloat(fd.get('contractedHours'))||0,
      startDate: fd.get('startDate')||todayISO()
    });
    ui.modal=null; render();
  }
  else if(type==='card-info'){
    const cardId = form.dataset.card;
    const card = getCard(cardId);
    const newHours = parseFloat(fd.get('contractedHours'))||0;
    const newStart = fd.get('startDate');
    const newTags = fd.getAll('productTags');
    let histTexts = [];
    if(newHours !== card.contractedHours) histTexts.push('Horas contratadas alteradas de '+card.contractedHours+'h para '+newHours+'h');
    if(newStart !== card.startDate) histTexts.push('Data de início alterada para '+fmtDateBR(newStart));
    card.contractedHours = newHours; card.startDate = newStart; card.productTags = newTags;
    histTexts.forEach(t=> addHistory(card, t));
    const moveVal = fd.get('moveTo');
    if(moveVal){ const [b,l] = moveVal.split('::'); moveCard(cardId, b, l); }
    ui.cardDraft = null;
    render();
  }
  else if(type==='schedule'){
    const cardId = form.dataset.card || null;
    const card = cardId ? getCard(cardId) : null;
    const analystId = card ? getBoard(card.boardId).analystId : fd.get('analystId');
    const clientId = card ? card.clientId : (fd.get('clientId') || null);
    const date = fd.get('date'), startTime = fd.get('startTime'), endTime = fd.get('endTime');
    if(timeToMin(endTime) <= timeToMin(startTime)){ ui.formErr = 'O horário de término deve ser depois do início.'; render(); return; }
    const id = form.dataset.id;
    if(scheduleConflict(analystId, date, startTime, endTime, id||null)){
      ui.formErr = 'O analista já possui um agendamento nesse horário. Escolha outro horário.';
      render(); return;
    }
    ui.formErr = '';
    const data = { analystId, clientId, cardId, date, startTime, endTime, type: fd.get('type'), modules: fd.getAll('modules'), trainedScreens: fd.getAll('trainedScreens'), trainedUsers: fd.get('trainedUsers')||'', notes: fd.get('notes')||'' };
    let sched;
    if(id){ updateSchedule(id, data); sched = byId(state.schedules, id); }
    else{ sched = createSchedule(data); }
    ui.modal = null;
    if(!sched.cardId && sched.clientId){
      const board = boardOfAnalyst(sched.analystId);
      if(board){
        const existingCard = state.cards.find(c=>c.clientId===sched.clientId && c.boardId===board.id);
        if(existingCard){
          sched.cardId = existingCard.id;
        } else {
          const client = getClient(sched.clientId);
          showConfirm('O cliente "'+client.name+'" ainda não tem um card no quadro deste analista. Deseja criar agora?', function(){
            const newCard = createCard(board.id, board.lists[0].id, sched.clientId, {});
            sched.cardId = newCard.id;
          });
          return;
        }
      }
    }
    render();
  }
  else if(type==='confirm-complete'){
    const minutes = parseInt(fd.get('deductMinutes'),10)||0;
    completeSchedule(form.dataset.id, minutes, fd.get('notes'));
    ui.modal=null; render();
  }
  else if(type==='product'){
    const name = fd.get('name').trim();
    const color = fd.get('color');
    const id = form.dataset.id;
    if(id){ const p=byId(state.productTags,id); if(p){ p.name=name; p.color=color; } }
    else{ state.productTags.push({id:uid('pt'), name, color}); }
    ui.modal=null; render();
  }
  else if(type==='module'){
    const name = fd.get('name').trim();
    const id = form.dataset.id;
    if(id){
      const md = byId(state.modules, id);
      if(md){ renameModuleEverywhere(md.name, name); md.name = name; }
    } else if(name && !state.modules.some(m=>m.name===name)){
      state.modules.push({id:uid('md'), name});
    }
    ui.modal=null; render();
  }
  else if(type==='screen'){
    const name = fd.get('name').trim();
    const moduleId = fd.get('moduleId');
    const id = form.dataset.id;
    if(id){
      const scr = byId(state.screens, id);
      if(scr){ renameScreenEverywhere(scr.name, name); scr.name = name; scr.moduleId = moduleId; }
    } else if(name && !state.screens.some(s=>s.name===name && s.moduleId===moduleId)){
      state.screens.push({id:uid('scr'), name, moduleId});
    }
    ui.modal=null; render();
  }
  else if(type==='agenda-type'){
    const name = fd.get('name').trim();
    const id = form.dataset.id;
    if(id){
      const tp = byId(state.agendaTypes, id);
      if(tp){ renameTypeEverywhere(tp.name, name); tp.name = name; }
    } else if(name && !state.agendaTypes.some(t=>t.name===name)){
      state.agendaTypes.push({id:uid('at'), name});
    }
    ui.modal=null; render();
  }
  else if(type==='cloud-config'){
    const url = fd.get('url').trim();
    const anonKey = fd.get('anonKey').trim();
    await connectCloud(url, anonKey);
  }
});

/* Drag and drop for cards, and for pending schedules on the calendar grid */
document.addEventListener('dragstart', function(e){
  const card = e.target.closest('.card-mini');
  if(card){ e.dataTransfer.setData('text/plain', card.dataset.cardId); e.dataTransfer.effectAllowed='move'; setTimeout(()=>card.classList.add('dragging'),0); return; }
  const evt = e.target.closest('.cal-tg-event');
  if(evt && evt.dataset.draggable==='1'){
    const rect = evt.getBoundingClientRect();
    const grabOffset = e.clientY - rect.top;
    e.dataTransfer.setData('text/plain', 'sched:'+evt.dataset.id+':'+grabOffset);
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>evt.classList.add('dragging'),0);
  }
});
document.addEventListener('dragend', function(e){
  const card = e.target.closest('.card-mini'); if(card) card.classList.remove('dragging');
  const evt = e.target.closest('.cal-tg-event'); if(evt) evt.classList.remove('dragging');
});
document.addEventListener('dragover', function(e){
  const list = e.target.closest('.list-cards'); if(list){ e.preventDefault(); list.classList.add('drag-over'); return; }
  const daycol = e.target.closest('.cal-tg-daycol'); if(daycol){ e.preventDefault(); daycol.classList.add('drag-over'); }
});
document.addEventListener('dragleave', function(e){
  const list = e.target.closest('.list-cards'); if(list){ list.classList.remove('drag-over'); }
  const daycol = e.target.closest('.cal-tg-daycol'); if(daycol){ daycol.classList.remove('drag-over'); }
});
document.addEventListener('drop', function(e){
  const list = e.target.closest('.list-cards');
  if(list){
    e.preventDefault(); list.classList.remove('drag-over');
    const payload = e.dataTransfer.getData('text/plain');
    if(payload && !payload.startsWith('sched:')){ moveCard(payload, list.dataset.boardId, list.dataset.listId); render(); }
    return;
  }
  const daycol = e.target.closest('.cal-tg-daycol');
  if(daycol){
    e.preventDefault(); daycol.classList.remove('drag-over');
    const payload = e.dataTransfer.getData('text/plain');
    if(payload && payload.startsWith('sched:')){
      const parts = payload.split(':');
      moveScheduleToGridPosition(parts[1], daycol, e.clientY, parseFloat(parts[2])||0);
    }
  }
});
function moveScheduleToGridPosition(schedId, daycolEl, clientY, grabOffset){
  const s = byId(state.schedules, schedId);
  if(!s || s.status!=='pendente') return;
  const rect = daycolEl.getBoundingClientRect();
  const startHour = parseFloat(daycolEl.dataset.startHour);
  const pxPerHour = parseFloat(daycolEl.dataset.pxPerHour);
  const dropTop = clientY - rect.top - grabOffset;
  let minutesFromStart = Math.round(((dropTop/pxPerHour)*60)/15)*15;
  const duration = timeToMin(s.endTime)-timeToMin(s.startTime);
  let newStartTotal = Math.max(0, Math.min(24*60-duration, startHour*60 + minutesFromStart));
  const pad = n=>String(n).padStart(2,'0');
  const newStart = pad(Math.floor(newStartTotal/60))+':'+pad(newStartTotal%60);
  const newEndTotal = newStartTotal+duration;
  const newEnd = pad(Math.floor(newEndTotal/60))+':'+pad(newEndTotal%60);
  const newDate = daycolEl.dataset.date;
  if(newDate===s.date && newStart===s.startTime) return;
  if(scheduleConflict(s.analystId, newDate, newStart, newEnd, s.id)){
    showAlert('O analista já possui um agendamento nesse horário. Escolha outro horário ou dia.');
    return;
  }
  const oldDate = s.date, oldStart = s.startTime, oldEnd = s.endTime;
  s.date = newDate; s.startTime = newStart; s.endTime = newEnd;
  if(s.cardId){
    const c = getCard(s.cardId);
    if(c) addHistory(c, 'Agenda reagendada de '+fmtDateBR(oldDate)+' '+oldStart+'–'+oldEnd+' para '+fmtDateBR(newDate)+' '+newStart+'–'+newEnd);
  }
  render();
}

/* Card detail overlay is rendered as an extra modal layer appended after main render */
function renderCardDetailOverlay(){
  const existing = document.getElementById('card-detail-overlay');
  if(existing) existing.remove();
  if(!ui.openCardId) return;
  const card = getCard(ui.openCardId);
  if(!card){ ui.openCardId=null; return; }
  const wrap = document.createElement('div');
  wrap.id = 'card-detail-overlay';
  wrap.className = 'overlay card-overlay';
  wrap.innerHTML = '<div class="modal wide">'+renderCardModalContent(card)+'</div>';
  document.body.appendChild(wrap);
}
/* Re-render overlay after any global render if a card is open (keep it in sync) */
const _origRender = render;
render = function(){ _origRender(); if(ui.openCardId){ renderCardDetailOverlay(); } else { const ex=document.getElementById('card-detail-overlay'); if(ex) ex.remove(); } };

/* Initial paint */
boot();
