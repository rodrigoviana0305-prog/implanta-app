<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implanta — Gestão de Implantação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#ECEEED; --bg-soft:#E2E5E3; --surface:#FFFFFF; --surface-2:#F5F6F5;
  --border:#D8DCDA; --ink:#181D1A; --ink-soft:#5A635D; --ink-faint:#8B948D;
  --brand:#2F5D50; --brand-dark:#1F423A; --brand-soft:#DCE8E3;
  --gold:#B9812E; --gold-soft:#F3E3C6;
  --danger:#A73E27; --danger-soft:#F3DCD4;
  --ok:#2F5D50; --ok-soft:#DCE8E3;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow-1:0 1px 2px rgba(24,29,26,.08),0 1px 1px rgba(24,29,26,.04);
  --shadow-2:0 12px 32px rgba(24,29,26,.18);
  --font-head:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --bg-soft:#1A1F21; --surface:#1F2528; --surface-2:#242B2E;
    --border:#343C3F; --ink:#EDEFEE; --ink-soft:#AEB6B2; --ink-faint:#78827E;
    --brand:#5FA48D; --brand-dark:#4A8B75; --brand-soft:#1F332C;
    --gold:#D9A85C; --gold-soft:#392E1A;
    --danger:#DB8770; --danger-soft:#3A241C;
    --ok:#5FA48D; --ok-soft:#1F332C;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --bg-soft:#1A1F21; --surface:#1F2528; --surface-2:#242B2E;
  --border:#343C3F; --ink:#EDEFEE; --ink-soft:#AEB6B2; --ink-faint:#78827E;
  --brand:#5FA48D; --brand-dark:#4A8B75; --brand-soft:#1F332C;
  --gold:#D9A85C; --gold-soft:#392E1A;
  --danger:#DB8770; --danger-soft:#3A241C;
  --ok:#5FA48D; --ok-soft:#1F332C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; font-size:14px; color:inherit; }
button{ cursor:pointer; }
h1,h2,h3,h4{ font-family:var(--font-head); margin:0; color:var(--ink); }
::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.shell{ display:flex; height:100vh; width:100%; overflow:hidden; }

/* ---------- Sidebar ---------- */
.sidebar{
  width:230px; flex:0 0 230px; background:var(--brand-dark); color:#EFF4F1;
  display:flex; flex-direction:column; padding:18px 14px; gap:18px; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:0 4px; }
.brand-mark{ width:30px;height:30px;border-radius:9px;background:var(--gold); display:flex;align-items:center;justify-content:center; font-family:var(--font-head); font-weight:800; color:#241a06; font-size:15px; flex:0 0 auto;}
.brand-name{ font-family:var(--font-head); font-weight:800; font-size:17px; letter-spacing:.2px; }
.side-section{ display:flex; flex-direction:column; gap:3px; }
.side-label{ font-size:11px; color:#B9CCC3; font-weight:600; padding:6px 8px 2px; display:flex; justify-content:space-between; align-items:center; }
.side-item{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; border:none;
  background:transparent; color:#E4EEE9; text-align:left; width:100%; font-size:13.5px; font-weight:500;
}
.side-item:hover{ background:rgba(255,255,255,.08); }
.side-item.active{ background:rgba(255,255,255,.16); color:#fff; }
.side-dot{ width:9px;height:9px;border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
.side-badge{ margin-left:auto; background:var(--gold); color:#241a06; font-size:11px; font-weight:800; border-radius:20px; padding:1px 7px; }
.side-add{ display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:8px; border:1px dashed rgba(255,255,255,.3); background:transparent; color:#CFE0D8; font-size:13px; width:100%; }
.side-add:hover{ background:rgba(255,255,255,.06); }
.side-spacer{ flex:1; }
.side-foot{ font-size:11px; color:#9FB6AC; padding:6px 8px; line-height:1.5; }

/* ---------- Main / Topbar ---------- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 22px; background:var(--surface);
  border-bottom:1px solid var(--border); flex:0 0 auto;
}
.topbar h2{ font-size:19px; }
.topbar .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:1px; }
.topbar-title{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; position:relative; }
.search-box{
  display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:7px 11px; min-width:200px;
}
.search-box input{ border:none; background:transparent; outline:none; width:100%; color:var(--ink); }
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border); background:var(--surface-2);
  display:flex;align-items:center;justify-content:center; position:relative; flex:0 0 auto;
}
.icon-btn:hover{ background:var(--bg-soft); }
.notif-dot{ position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:800; border-radius:20px; min-width:16px; height:16px; display:flex;align-items:center;justify-content:center; padding:0 3px; }
.view{ flex:1; overflow:auto; padding:20px 22px 40px; }

/* ---------- Buttons ---------- */
.btn{ border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:8px 14px; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn-primary:hover{ background:var(--brand-dark); }
.btn-gold{ background:var(--gold); border-color:var(--gold); color:#241a06; }
.btn-gold:hover{ filter:brightness(0.95); }
.btn-danger{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
.btn-danger:hover{ background:var(--danger); color:#fff; }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-sm{ padding:5px 10px; font-size:12.5px; border-radius:7px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ---------- Board / Lists / Cards ---------- */
.board-lists{ display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:16px; min-height:60vh; }
.list-col{ background:var(--bg-soft); border-radius:var(--radius-m); width:270px; flex:0 0 270px; display:flex; flex-direction:column; max-height:calc(100vh - 190px); }
.list-head{ display:flex; align-items:center; gap:8px; padding:11px 12px 7px; }
.list-head .name{ font-weight:700; font-size:13.5px; flex:1; }
.list-head .count{ font-size:11.5px; color:var(--ink-faint); background:var(--surface); border-radius:20px; padding:1px 8px; }
.list-cards{ flex:1; overflow-y:auto; padding:2px 10px; display:flex; flex-direction:column; gap:9px; min-height:40px; }
.list-cards.drag-over{ background:var(--brand-soft); border-radius:8px; }
.card-mini{ background:var(--surface); border-radius:9px; padding:10px 11px; box-shadow:var(--shadow-1); cursor:grab; border:1px solid transparent; display:flex; flex-direction:column; gap:6px; }
.card-mini:hover{ border-color:var(--border); }
.card-mini.dragging{ opacity:.4; }
.chip-row{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; color:#fff; letter-spacing:.2px; }
.card-title{ font-weight:700; font-size:13.5px; color:var(--ink); }
.card-meta{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-soft); }
.balance-pill{ font-weight:700; padding:1px 7px; border-radius:20px; background:var(--ok-soft); color:var(--ok); }
.balance-pill.neg{ background:var(--danger-soft); color:var(--danger); }
.pending-flag{ color:var(--danger); font-weight:700; display:flex; align-items:center; gap:3px; }
.add-card-btn{ margin:4px 10px 10px; padding:8px 10px; border-radius:8px; background:transparent; border:1px dashed var(--border); color:var(--ink-soft); text-align:left; font-size:13px; }
.add-card-btn:hover{ background:var(--surface); color:var(--ink); }
.list-add-col{ width:230px; flex:0 0 230px; }
.list-add-col button{ width:100%; padding:11px; border-radius:var(--radius-m); border:1.5px dashed var(--border); background:transparent; color:var(--ink-soft); font-weight:600; }
.list-add-col button:hover{ background:var(--surface); }

.empty-state{ text-align:center; padding:70px 20px; max-width:440px; margin:0 auto; }
.empty-state h3{ font-size:20px; margin-bottom:8px; }
.empty-state p{ color:var(--ink-soft); margin-bottom:20px; }

/* ---------- Modals ---------- */
.overlay{ position:fixed; inset:0; background:rgba(15,20,17,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100; }
.overlay.card-overlay{ z-index:90; }
.overlay.confirm-overlay{ z-index:300; }
.modal{ background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow-2); width:100%; max-width:520px; padding:22px 24px 24px; }
.modal.wide{ max-width:680px; }
.modal-header{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
.modal-header h3{ font-size:18px; flex:1; }
.modal-close{ background:none;border:none;font-size:20px;color:var(--ink-faint); line-height:1; padding:2px 4px;}
.modal-close:hover{ color:var(--ink); }
.field{ margin-bottom:13px; display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field input[type=email], .field input[type=tel], .field select, .field textarea{
  border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:var(--surface-2); color:var(--ink); outline:none; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--brand); background:var(--surface); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.check-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.check-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12.5px; background:var(--surface-2); }
.check-pill input{ accent-color:var(--brand); }
.form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.error-msg{ background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:8px 11px; font-size:12.5px; font-weight:600; margin-bottom:12px; white-space:pre-line; }
input[type=color]{ width:38px; height:32px; padding:2px; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); }

/* ---------- Card modal ---------- */
.card-modal-top{ display:flex; align-items:flex-start; gap:12px; }
.card-modal-meta{ font-size:12.5px; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin:16px 0 16px; }
.tab-btn{ background:none; border:none; padding:9px 4px; margin-right:16px; font-weight:700; color:var(--ink-faint); border-bottom:2px solid transparent; }
.tab-btn.active{ color:var(--brand); border-color:var(--brand); }
.balance-box{ display:flex; gap:10px; margin-bottom:16px; }
.balance-item{ flex:1; background:var(--surface-2); border-radius:10px; padding:11px 13px; text-align:center; }
.balance-item .num{ font-family:var(--font-head); font-weight:800; font-size:19px; }
.balance-item .lbl{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.sched-row{ display:flex; align-items:center; gap:10px; padding:10px 11px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; background:var(--surface-2); }
.sched-row.due{ border-color:var(--danger); background:var(--danger-soft); }
.sched-main{ flex:1; min-width:0; }
.sched-time{ font-weight:700; font-size:13px; }
.sched-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.badge{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
.badge.pendente{ background:var(--gold-soft); color:var(--gold); }
.badge.concluida{ background:var(--ok-soft); color:var(--ok); }
.badge.nao_realizada{ background:var(--danger-soft); color:var(--danger); }
.hist-row{ padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.hist-row .ts{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
.row-actions{ display:flex; gap:5px; flex:0 0 auto; }

/* ---------- Calendar ---------- */
.cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.cal-toolbar .grow{ flex:1; }
.cal-tg-outer{ border:1px solid var(--border); border-radius:10px; overflow-x:auto; overflow-y:hidden; background:var(--surface); }
.cal-tg-inner{ min-width:680px; }
.cal-tg-headerrow{ display:grid; grid-template-columns:56px repeat(7,1fr); border-bottom:1px solid var(--border); background:var(--surface); }
.cal-tg-daycol-head{ padding:8px 6px; text-align:center; border-left:1px solid var(--border); }
.cal-tg-daycol-head .wd{ font-size:10.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; }
.cal-tg-daycol-head .dt{ font-family:var(--font-head); font-weight:800; font-size:14px; }
.cal-tg-daycol-head.today .dt{ color:var(--brand); }
.cal-tg-bodyscroll{ max-height:64vh; overflow-y:auto; }
.cal-tg-bodyrow{ display:grid; grid-template-columns:56px repeat(7,1fr); position:relative; }
.cal-tg-hourlabels{ position:relative; }
.cal-tg-hourlabel{ position:absolute; right:8px; transform:translateY(-50%); font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
.cal-tg-daycol{ position:relative; border-left:1px solid var(--border); cursor:pointer; background-image:repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent var(--hour-px)); }
.cal-tg-daycol:hover{ background-color:var(--surface-2); }
.cal-tg-daycol.drag-over{ background-color:var(--brand-soft); }
.cal-tg-event{ position:absolute; border-radius:6px; padding:3px 6px; font-size:11px; overflow:hidden; border-left:3px solid var(--brand); background:var(--brand-soft); cursor:pointer; line-height:1.3; }
.cal-tg-event[draggable="true"]{ cursor:grab; }
.cal-tg-event.dragging{ opacity:.4; }
.cal-tg-event:hover{ filter:brightness(0.97); }
.cal-tg-event.due{ background:var(--danger-soft); border-left-color:var(--danger); }
.cal-tg-event .t{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-tg-now{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--danger); z-index:5; pointer-events:none; }
.cal-tg-now::before{ content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--danger); }
.notif-panel{ position:absolute; top:44px; right:0; width:330px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-2); padding:8px; z-index:50; max-height:400px; overflow-y:auto; }
.notif-item{ padding:9px 10px; border-radius:8px; }
.notif-item:hover{ background:var(--surface-2); }
.notif-empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }

/* ---------- Tables ---------- */
table{ width:100%; border-collapse:collapse; background:var(--surface); border-radius:10px; overflow:hidden; }
th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
th{ background:var(--surface-2); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-soft); font-weight:700; }
tr:last-child td{ border-bottom:none; }
.section-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
.section-card h3{ font-size:15px; margin-bottom:12px; }
.settings-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.inline-add{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.inline-add input[type=text]{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-2); }
.tag-list{ display:flex; flex-wrap:wrap; gap:8px; }
.tag-list .chip-x{ display:flex; align-items:center; gap:6px; }
.tag-list .chip-x button{ background:rgba(255,255,255,.35); border:none; border-radius:50%; width:15px;height:15px; font-size:10px; line-height:1; color:inherit; }
.list-plain{ display:flex; flex-wrap:wrap; gap:8px; }
.list-plain .item-x{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); padding:5px 10px; border-radius:20px; font-size:12.5px; }
.list-plain .item-x button{ background:none;border:none;color:var(--ink-faint); font-weight:700; }
.hint{ font-size:12px; color:var(--ink-faint); margin-top:8px; }
@media (max-width:820px){
  .sidebar{ display:none; }
}
</style>
</head>

<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#5A635D;font-family:'Inter',sans-serif;">Carregando...</div></div>

<script>
/* ============================= STATE ============================= */
const STORAGE_KEY = 'implanta_v1';
const PALETTE = ['#3E8E7E','#C99A2E','#7B4B94','#3E74B0','#B15577','#6E7B3B','#A05A2C','#52616B'];

function defaultState(){
  return {
    analysts: [],
    boards: [],
    clients: [],
    cards: [],
    schedules: [],
    productTags: [
      {id:uid('pt'), name:'PDV', color:'#3E8E7E'},
      {id:uid('pt'), name:'Frota', color:'#C99A2E'},
      {id:uid('pt'), name:'Financeiro', color:'#7B4B94'},
      {id:uid('pt'), name:'Estoque', color:'#3E74B0'}
    ],
    modules: [],
    screens: [],
    agendaTypes: [
      {id:uid('at'), name:'Treinamento'},
      {id:uid('at'), name:'Reunião'},
      {id:uid('at'), name:'Visita'},
      {id:uid('at'), name:'Interna'}
    ]
  };
}
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function normalizeState(raw){
  let s = raw;
  if(!s || typeof s!=='object') s = defaultState();
  ['analysts','boards','clients','cards','schedules','productTags','modules','screens','agendaTypes'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=defaultState()[k]; });
  // Migrate modules/agendaTypes from old plain-string arrays to {id, name} objects, if needed.
  s.modules = s.modules.map(m=> (typeof m==='string') ? {id:uid('md'), name:m} : m);
  s.agendaTypes = s.agendaTypes.map(t=> (typeof t==='string') ? {id:uid('at'), name:t} : t);
  return s;
}
function loadLocalState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return normalizeState(raw ? JSON.parse(raw) : defaultState());
  }catch(e){ return defaultState(); }
}

/* ---- Cloud (Supabase) config: optional. When configured, data is stored in a
   Postgres table instead of (only) localStorage, so it can be shared across
   devices/browsers. See the "Nuvem" tab in Configurações to set it up.
   DEFAULT_CLOUD_CONFIG is baked into this file so every computer that opens
   the published page connects automatically, with no per-browser setup.
   The publishable key is meant to be public (protected by RLS/policies, not
   by secrecy), so it's fine for it to live here in plain sight. ---- */
const DEFAULT_CLOUD_CONFIG = {
  url: 'https://pfabqqdhvacakszoklxh.supabase.co',
  anonKey: 'sb_publishable_0lFYSvX-C7n3Y1FVZ4RWvQ_8HVOCxQI'
};
const CLOUD_CONFIG_KEY = 'implanta_cloud_config_v1';
const CLOUD_DISABLED_KEY = 'implanta_cloud_disabled_v1';
function loadCloudConfig(){
  try{
    if(localStorage.getItem(CLOUD_DISABLED_KEY)==='1') return null;
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
    if(DEFAULT_CLOUD_CONFIG.url && DEFAULT_CLOUD_CONFIG.anonKey) return DEFAULT_CLOUD_CONFIG;
    return null;
  }catch(e){ return null; }
}
var cloudConfig = loadCloudConfig();
var usingDefaultCloud = !!(cloudConfig && DEFAULT_CLOUD_CONFIG.url && cloudConfig.url===DEFAULT_CLOUD_CONFIG.url && cloudConfig.anonKey===DEFAULT_CLOUD_CONFIG.anonKey);
var sbClient = null;
var cloudStatus = cloudConfig ? 'connecting' : 'local'; // 'local' | 'connecting' | 'connected' | 'error'
var cloudErrorMsg = '';
var saveStatus = 'idle'; // 'idle' | 'pending' | 'saving' | 'saved' | 'error'
var saveTimer = null;
var lastKnownUpdatedAt = null; // updated_at of the cloud row as of our last successful read/write

var state = loadLocalState();

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn('Falha ao salvar localmente', e); }
  if(cloudStatus==='connected' && sbClient){
    saveStatus = 'pending';
    updateSaveStatusLine();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(cloudSave, 800);
  }
}
function sameInstant(a, b){
  if(!a || !b) return false;
  const ta = new Date(a).getTime(), tb = new Date(b).getTime();
  if(isNaN(ta) || isNaN(tb)) return false;
  return Math.abs(ta - tb) < 1000; // treat sub-second formatting/precision differences as "the same moment"
}
async function cloudSave(){
  if(!sbClient) return;
  saveStatus = 'saving';
  updateSaveStatusLine();
  try{
    const { data: fresh, error: fetchErr } = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
    if(fetchErr) throw fetchErr;
    // Only merge if someone else has actually saved since our last read/write - merging on every
    // save is what caused deletions (of a module, an analyst, anything) to keep reappearing, since
    // the just-deleted item still existed in the cloud copy being merged back in. When nothing has
    // changed remotely, we're the single source of truth and can just overwrite outright.
    // Comparing timestamps as exact strings was fragile (Postgres can format the same instant
    // slightly differently than what we sent), so this compares them as actual points in time.
    if(fresh && fresh.updated_at && !sameInstant(fresh.updated_at, lastKnownUpdatedAt) && fresh.data){
      state = mergeStates(normalizeState(fresh.data), state);
    }
    const nowIso = new Date().toISOString();
    const { error } = await sbClient.from('app_state').update({data: state, updated_at: nowIso}).eq('id', 1);
    if(error) throw error;
    lastKnownUpdatedAt = nowIso;
    saveStatus = 'saved';
  }catch(e){
    console.warn('Falha ao salvar na nuvem', e);
    saveStatus = 'error';
  }
  updateSaveStatusLine();
}
/* Best-effort merge, used only when the cloud row changed since we last read it (a genuine
   concurrent edit from another tab/computer). Unions each entity array by id (same id on both
   sides: local wins); modules/agendaTypes (plain strings) are unioned directly. This can't tell a
   real remote deletion apart from "hasn't synced yet", so in that specific overlap window a
   deletion made on the other side could reappear - but this path is now only hit on an actual
   detected conflict, not on every save, so it no longer blocks ordinary deletes. */
function mergeStates(remote, local){
  const merged = Object.assign({}, local);
  ['analysts','boards','clients','cards','schedules','productTags'].forEach(key=>{
    const byId = new Map();
    (remote[key]||[]).forEach(item=> byId.set(item.id, item));
    (local[key]||[]).forEach(item=> byId.set(item.id, item));
    merged[key] = [...byId.values()];
  });
  ['modules','agendaTypes'].forEach(key=>{
    merged[key] = [...new Set([...(remote[key]||[]), ...(local[key]||[])])];
  });
  return merged;
}
function updateSaveStatusLine(){
  const el = document.getElementById('save-status-line');
  if(!el) return;
  if(cloudStatus!=='connected'){ el.textContent = 'Dados salvos neste navegador.'; return; }
  if(saveStatus==='pending' || saveStatus==='saving') el.innerHTML = '☁ Salvando...';
  else if(saveStatus==='error') el.innerHTML = '⚠ Falha ao salvar na nuvem (tentando de novo na próxima alteração)';
  else el.innerHTML = '☁ Sincronizado com a nuvem';
}
function setForceSaveMsg(text, isError){
  const el = document.getElementById('force-save-msg');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? 'var(--danger)' : '';
}
async function forceSaveNow(){
  clearTimeout(saveTimer);
  if(cloudStatus==='connected' && sbClient){
    setForceSaveMsg('Salvando na nuvem...');
    await cloudSave();
    setForceSaveMsg(saveStatus==='saved' ? '✓ Alterações salvas na nuvem.' : '⚠ Falha ao salvar — tente de novo.', saveStatus!=='saved');
  } else {
    setForceSaveMsg('✓ Salvo neste navegador.');
  }
}
/* If the tab is being switched away from or closed while a save is still waiting on the debounce,
   flush it immediately instead of risking losing the last change. */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden' && saveStatus==='pending' && sbClient){
    clearTimeout(saveTimer);
    cloudSave();
  }
});
async function connectCloud(url, anonKey){
  cloudConfig = {url, anonKey};
  usingDefaultCloud = (url===DEFAULT_CLOUD_CONFIG.url && anonKey===DEFAULT_CLOUD_CONFIG.anonKey);
  localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
  localStorage.removeItem(CLOUD_DISABLED_KEY);
  cloudStatus = 'connecting'; cloudErrorMsg=''; render();
  await boot();
}
function disconnectCloud(){
  cloudConfig = null; sbClient = null; cloudStatus = 'local'; cloudErrorMsg=''; usingDefaultCloud = false;
  localStorage.removeItem(CLOUD_CONFIG_KEY);
  localStorage.setItem(CLOUD_DISABLED_KEY, '1');
  render();
}
async function boot(){
  if(cloudConfig && window.supabase){
    try{
      sbClient = window.supabase.createClient(cloudConfig.url, cloudConfig.anonKey);
      const { data, error } = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
      if(error) throw error;
      if(data && data.data){
        state = normalizeState(data.data);
        lastKnownUpdatedAt = data.updated_at || null;
      } else {
        // First time connecting this project: seed the cloud with whatever is already stored locally,
        // so existing work isn't lost when turning cloud sync on.
        state = loadLocalState();
        const nowIso = new Date().toISOString();
        const ins = await sbClient.from('app_state').insert({id:1, data: state, updated_at: nowIso});
        if(ins.error) throw ins.error;
        lastKnownUpdatedAt = nowIso;
      }
      cloudStatus = 'connected';
    }catch(e){
      console.warn('Falha ao conectar à nuvem', e);
      cloudStatus = 'error';
      const detail = (e && (e.message || e.error_description || e.hint || e.details)) || 'erro desconhecido';
      cloudErrorMsg = 'Não foi possível conectar ao banco na nuvem. Usando os dados salvos neste navegador por enquanto.\nDetalhe técnico: '+detail;
      sbClient = null;
      state = loadLocalState();
    }
  } else {
    state = loadLocalState();
  }
  render();
}

/* ============================= HELPERS ============================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function startOfWeekISO(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
const WD_NAMES = ['seg','ter','qua','qui','sex','sáb','dom'];
function weekdayShort(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return WD_NAMES[(dt.getDay()+6)%7]; }
function fmtDT(ts){ const d=new Date(ts); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function minToHM(min){ const sign = min<0?'-':''; min=Math.abs(Math.round(min)); const h=Math.floor(min/60), m=min%60; return sign + h + 'h' + (m>0? String(m).padStart(2,'0')+'m':''); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function captureFormValues(form){
  const fd = new FormData(form);
  const multiNames = new Set();
  form.querySelectorAll('input[type=checkbox]').forEach(cb=> multiNames.add(cb.name));
  const values = {};
  multiNames.forEach(n=> values[n] = fd.getAll(n));
  for(const [k,v] of fd.entries()){ if(!multiNames.has(k)) values[k] = v; }
  return values;
}

function getBoard(id){ return byId(state.boards,id); }
function getAnalyst(id){ return byId(state.analysts,id); }
function getClient(id){ return byId(state.clients,id); }
function getCard(id){ return byId(state.cards,id); }
function boardOfAnalyst(analystId){ return state.boards.find(b=>b.analystId===analystId); }
function cardsInBoard(boardId){ return state.cards.filter(c=>c.boardId===boardId); }
function schedulesForCard(cardId){ return state.schedules.filter(s=>s.cardId===cardId).sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime)); }
function cardUsedMinutes(card){ return state.schedules.filter(s=>s.cardId===card.id && s.status==='concluida').reduce((sum,s)=> sum + (s.deductMinutes!=null ? s.deductMinutes : (timeToMin(s.endTime)-timeToMin(s.startTime))), 0); }
function cardBalanceHours(card){ return (card.contractedHours||0) - cardUsedMinutes(card)/60; }
function clientHasCardInBoard(clientId, boardId){ return state.cards.some(c=>c.clientId===clientId && c.boardId===boardId); }
function cardsUsingProduct(tagId){ return state.cards.filter(c=> (c.productTags||[]).includes(tagId)); }
function schedulesUsingModule(name){ return state.schedules.filter(s=> (s.modules||[]).includes(name)); }
function schedulesUsingType(name){ return state.schedules.filter(s=> s.type===name); }
function screensForModule(moduleId){ return state.screens.filter(s=>s.moduleId===moduleId); }
function schedulesUsingScreen(name){ return state.schedules.filter(s=> (s.trainedScreens||[]).includes(name)); }
function renameScreenEverywhere(oldName, newName){
  if(oldName===newName) return;
  state.schedules.forEach(s=>{ if(Array.isArray(s.trainedScreens) && s.trainedScreens.includes(oldName)){ s.trainedScreens = s.trainedScreens.map(n=> n===oldName?newName:n); } });
}
function clientNamesForSchedules(scheds){
  const names = new Set();
  scheds.forEach(s=>{ if(s.cardId){ const c=getCard(s.cardId); if(c){ const cl=getClient(c.clientId); if(cl) names.add(cl.name); } } });
  return [...names];
}
function renameModuleEverywhere(oldName, newName){
  if(oldName===newName) return;
  state.schedules.forEach(s=>{ if(Array.isArray(s.modules) && s.modules.includes(oldName)){ s.modules = s.modules.map(m=> m===oldName?newName:m); } });
}
function renameTypeEverywhere(oldName, newName){
  if(oldName===newName) return;
  state.schedules.forEach(s=>{ if(s.type===oldName) s.type = newName; });
}
function scheduleConflict(analystId, date, start, end, excludeId){
  const s0=timeToMin(start), e0=timeToMin(end);
  return state.schedules.some(s=> s.id!==excludeId && s.analystId===analystId && s.date===date && s.status!=='nao_realizada' && !(e0<=timeToMin(s.startTime) || s0>=timeToMin(s.endTime)));
}
function scheduleIsDue(s){ if(s.status!=='pendente') return false; const end=new Date(s.date+'T'+(s.endTime||'00:00')+':00'); return end.getTime() < Date.now(); }
function pendingConfirmations(analystId){ return state.schedules.filter(s=> scheduleIsDue(s) && (!analystId || s.analystId===analystId)); }
function addHistory(card, text){ card.history = card.history||[]; card.history.unshift({ts:Date.now(), text}); }
function colorForIndex(i){ return PALETTE[i % PALETTE.length]; }

/* ============================= MUTATIONS ============================= */
function createAnalyst(name, color){
  const analyst = {id:uid('an'), name, color: color || colorForIndex(state.analysts.length)};
  state.analysts.push(analyst);
  const board = {id:uid('bd'), name:'Quadro — '+name, analystId:analyst.id, lists:[
    {id:uid('ls'), name:'Fila / Cadastro'},
    {id:uid('ls'), name:'Em implantação'},
    {id:uid('ls'), name:'Treinamento'},
    {id:uid('ls'), name:'Concluído'}
  ]};
  state.boards.push(board);
  return {analyst, board};
}
function deleteAnalyst(id){
  const board = boardOfAnalyst(id);
  if(board){
    const cardIds = cardsInBoard(board.id).map(c=>c.id);
    state.schedules = state.schedules.filter(s=> !cardIds.includes(s.cardId) && s.analystId!==id);
    state.cards = state.cards.filter(c=> c.boardId!==board.id);
    state.boards = state.boards.filter(b=> b.id!==board.id);
  }
  state.analysts = state.analysts.filter(a=>a.id!==id);
}
function createClient(data){ const c = {id:uid('cl'), name:data.name, contact:data.contact||'', email:data.email||'', phone:data.phone||'', segment:data.segment||'', city:data.city||'', clientType:data.clientType||'novo', createdAt:Date.now()}; state.clients.push(c); return c; }
function updateClient(id, patch){ const c=getClient(id); if(c) Object.assign(c, patch); }
function deleteClient(id){
  state.cards = state.cards.filter(c=>{ if(c.clientId===id){ state.schedules = state.schedules.filter(s=>s.cardId!==c.id); return false; } return true; });
  state.clients = state.clients.filter(c=>c.id!==id);
}
function createCard(boardId, listId, clientId, extra){
  const card = Object.assign({id:uid('cd'), boardId, listId, clientId, contractedHours:0, startDate:todayISO(), productTags:[], history:[{ts:Date.now(), text:'Card criado'}]}, extra||{});
  state.cards.push(card);
  return card;
}
function updateCard(id, patch, historyText){ const c=getCard(id); if(!c) return; Object.assign(c, patch); if(historyText) addHistory(c, historyText); }
function moveCard(cardId, boardId, listId){
  const c=getCard(cardId); if(!c) return;
  const fromBoard = getBoard(c.boardId), fromList = fromBoard ? byId(fromBoard.lists, c.listId) : null;
  const toBoard = getBoard(boardId), toList = toBoard ? byId(toBoard.lists, listId) : null;
  if(c.boardId===boardId && c.listId===listId) return;
  c.boardId = boardId; c.listId = listId;
  let text = '';
  if(fromBoard && toBoard && fromBoard.id!==toBoard.id){ text = 'Movido de "'+esc(fromBoard.name)+'" para "'+esc(toBoard.name)+'"'; if(toList) text += ' — lista "'+esc(toList.name)+'"'; }
  else if(toList){ text = 'Estágio alterado para "'+esc(toList.name)+'"'; }
  addHistory(c, text);
}
function deleteCard(id){ state.schedules = state.schedules.filter(s=>s.cardId!==id); state.cards = state.cards.filter(c=>c.id!==id); }
function createSchedule(data){
  const s = Object.assign({id:uid('sc'), status:'pendente', deductMinutes:null, modules:[], notes:''}, data);
  state.schedules.push(s);
  return s;
}
function updateSchedule(id, patch){ const s=byId(state.schedules,id); if(s) Object.assign(s, patch); }
function completeSchedule(id, deductMinutes, note){
  const s=byId(state.schedules,id); if(!s) return;
  s.status='concluida'; s.deductMinutes=deductMinutes; if(note) s.notes = note;
  if(s.cardId){ const c=getCard(s.cardId); if(c) addHistory(c, 'Agenda concluída ('+fmtDateBR(s.date)+' '+s.startTime+'–'+s.endTime+') — '+minToHM(deductMinutes)+' abatido(s)'); }
}
function markNotDone(id){
  const s=byId(state.schedules,id); if(!s) return;
  s.status='nao_realizada';
  if(s.cardId){ const c=getCard(s.cardId); if(c) addHistory(c, 'Agenda marcada como não realizada ('+fmtDateBR(s.date)+' '+s.startTime+'–'+s.endTime+')'); }
}
function revertToPending(id){
  const s=byId(state.schedules,id); if(!s || s.status==='pendente') return;
  const wasConcluida = s.status==='concluida';
  const deducted = s.deductMinutes;
  s.status='pendente'; s.deductMinutes=null;
  if(s.cardId){
    const c=getCard(s.cardId);
    if(c){
      if(wasConcluida) addHistory(c, 'Conclusão revertida ('+fmtDateBR(s.date)+' '+s.startTime+'–'+s.endTime+') — '+minToHM(deducted||0)+' estornado(s)');
      else addHistory(c, 'Agenda revertida para pendente ('+fmtDateBR(s.date)+' '+s.startTime+'–'+s.endTime+')');
    }
  }
}
function deleteSchedule(id){ state.schedules = state.schedules.filter(s=>s.id!==id); }
function addList(boardId, name){ const b=getBoard(boardId); if(b) b.lists.push({id:uid('ls'), name}); }
function deleteListFromBoard(boardId, listId){
  const b=getBoard(boardId); if(!b) return;
  const hasCards = state.cards.some(c=>c.boardId===boardId && c.listId===listId);
  if(hasCards){ showAlert('Mova ou remova os cards desta lista antes de excluí-la.'); return; }
  b.lists = b.lists.filter(l=>l.id!==listId);
}

function render(){
  persist();
  const app = document.getElementById('app');
  app.innerHTML = renderShell();
  if(ui._focus){
    const el = document.getElementById(ui._focus.id);
    if(el){ el.focus(); try{ el.setSelectionRange(ui._focus.pos, ui._focus.pos); }catch(e){} }
  }
}

function renderShell(){
  return '<div class="shell">'
    + '<aside class="sidebar">'+renderSidebar()+'</aside>'
    + '<main class="main">'
      + '<header class="topbar">'+renderTopbar()+'</header>'
      + '<div class="view">'+renderView()+'</div>'
    + '</main>'
    + '</div>'
    + (ui.modal ? renderModal() : '')
    + (ui.confirmDialog ? renderConfirmDialog() : '');
}

      + '</button>';
  });

    const analyst = board ? getAnalyst(board.analystId) : null;

  } else if(ui.view==='calendar'){
    left = '<div class="topbar-title"><h2>Agenda</h2><div class="sub">Visualize por analista ou em conjunto</div></div>';
  } else if(ui.view==='reports'){
    left = '<div class="topbar-title"><h2>Relatórios</h2></div>';
  } else if(ui.view==='clients'){
    left = '<div class="topbar-title"><h2>Clientes</h2><div class="sub">Base de cadastro</div></div>'
      + '<button class="btn btn-primary" data-action="open-modal" data-modal="client-new">+ Novo cliente</button>';
  } else if(ui.view==='settings'){
    left = '<div class="topbar-title"><h2>Configurações</h2></div>';
  }
  let right = '<div class="icon-btn" data-action="toggle-notif" title="Notificações">🔔'+(totalPend? '<span class="notif-dot">'+totalPend+'</span>':'')+'</div>';
  if(ui.showNotif) right += renderNotifPanel();
  return left + '<div class="topbar-right">'+right+'</div>';
}
function renderNotifPanel(){
  const items = pendingConfirmations(null);
  let html = '<div class="notif-panel">';
  if(!items.length){ html += '<div class="notif-empty">Nenhuma confirmação pendente.</div>'; }
  else{
    items.sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));
    items.forEach(s=>{
      const analyst = getAnalyst(s.analystId);
      const client = s.clientId ? getClient(s.clientId) : null;
      html += '<div class="notif-item">'
        + '<div style="font-weight:700;font-size:13px;">'+esc(client? client.name : 'Interno')+' · '+esc(s.type)+'</div>'
        + '<div style="font-size:11.5px;color:var(--ink-soft);margin:2px 0 6px;">'+fmtDateBR(s.date)+' '+s.startTime+'–'+s.endTime+' · '+esc(analyst? analyst.name:'')+'</div>'
        + '<div class="row-actions">'
          + '<button class="btn btn-sm btn-primary" data-action="open-modal" data-modal="confirm-complete" data-id="'+s.id+'">Confirmar</button>'
          + '<button class="btn btn-sm btn-ghost" data-action="mark-not-done" data-id="'+s.id+'">Não realizada</button>'

/* ============================= CALENDAR VIEW (day/time grid, Google Calendar style) ============================= */
function calcCalTimeRange(scheds){
  let minH = 7, maxH = 21;
  scheds.forEach(s=>{
    const sh = Math.floor(timeToMin(s.startTime)/60);
    const eh = Math.ceil(timeToMin(s.endTime)/60);
    if(sh < minH) minH = Math.max(0, sh-1);
    if(eh > maxH) maxH = Math.min(24, eh+1);
  });
  return {startHour:minH, endHour:maxH};
}
function layoutDayEvents(scheds){
  const items = scheds.map(s=>({ s, start:timeToMin(s.startTime), end:Math.max(timeToMin(s.endTime), timeToMin(s.startTime)+15) }))
    .sort((a,b)=> a.start-b.start || a.end-b.end);
  const clusters = [];
  let current = [], clusterEnd = -1;
  items.forEach(it=>{
    if(current.length && it.start >= clusterEnd){ clusters.push(current); current = []; }
    current.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  });
  if(current.length) clusters.push(current);
  const result = [];
  clusters.forEach(cluster=>{
    const lanes = [];
    cluster.forEach(it=>{
      let laneIdx = lanes.findIndex(endT=> it.start >= endT);
      if(laneIdx===-1){ laneIdx = lanes.length; lanes.push(it.end); } else { lanes[laneIdx] = it.end; }
      it.lane = laneIdx;
    });
    const totalLanes = lanes.length;
    cluster.forEach(it=> result.push({sched:it.s, start:it.start, end:it.end, lane:it.lane, lanes:totalLanes}));
  });
  return result;
}
function renderCalendarView(){
  let html = '<div class="cal-toolbar">'
    + '<select id="cal-analyst-filter" data-action="cal-filter">'
      + '<option value="all"'+(ui.calAnalyst==='all'?' selected':'')+'>Todos os analistas</option>';
  state.analysts.forEach(a=> html += '<option value="'+a.id+'"'+(ui.calAnalyst===a.id?' selected':'')+'>'+esc(a.name)+'</option>');
  html += '</select>'
    + '<button class="btn btn-sm" data-action="cal-nav" data-dir="-1">‹ Semana anterior</button>'
    + '<button class="btn btn-sm" data-action="cal-nav" data-dir="0">Hoje</button>'
    + '<button class="btn btn-sm" data-action="cal-nav" data-dir="1">Próxima semana ›</button>'
    + '<span class="grow"></span>'
    + '<button class="btn btn-primary" data-action="open-modal" data-modal="schedule-new">+ Novo agendamento</button>'
    + '</div>';

  const days = [];
  for(let i=0;i<7;i++) days.push(addDaysISO(ui.calStart, i));
  let weekScheds = [];
  days.forEach(d=>{ weekScheds = weekScheds.concat(state.schedules.filter(s=>s.date===d && (ui.calAnalyst==='all' || s.analystId===ui.calAnalyst))); });
  const {startHour, endHour} = calcCalTimeRange(weekScheds);
  const pxPerHour = 48;
  const pxPerMin = pxPerHour/60;
  const gridHeight = (endHour-startHour)*pxPerHour;
  const today = todayISO();

  html += '<div class="cal-tg-outer"><div class="cal-tg-inner">';
  html += '<div class="cal-tg-headerrow"><div></div>';
  days.forEach(d=>{
    html += '<div class="cal-tg-daycol-head'+(d===today?' today':'')+'"><div class="wd">'+weekdayShort(d)+'</div><div class="dt">'+fmtDateBR(d).slice(0,5)+'</div></div>';
  });
  html += '</div>';

  html += '<div class="cal-tg-bodyscroll"><div class="cal-tg-bodyrow" style="height:'+gridHeight+'px;">';
  html += '<div class="cal-tg-hourlabels" style="height:'+gridHeight+'px;">';
  for(let h=startHour; h<=endHour; h++){
    html += '<div class="cal-tg-hourlabel" style="top:'+((h-startHour)*pxPerHour)+'px;">'+String(h).padStart(2,'0')+':00</div>';
  }
  html += '</div>';

  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();

  days.forEach(d=>{
    const scheds = state.schedules.filter(s=>s.date===d && (ui.calAnalyst==='all' || s.analystId===ui.calAnalyst));
    const laidOut = layoutDayEvents(scheds);
    html += '<div class="cal-tg-daycol" data-action="cal-grid-click" data-date="'+d+'" data-start-hour="'+startHour+'" data-px-per-hour="'+pxPerHour+'" style="height:'+gridHeight+'px;--hour-px:'+pxPerHour+'px;">';
    laidOut.forEach(item=>{
      const s = item.sched;
      const analyst = getAnalyst(s.analystId);
      const client = s.clientId? getClient(s.clientId) : null;
      const due = scheduleIsDue(s);
      const top = (item.start - startHour*60)*pxPerMin;
      const height = Math.max((item.end-item.start)*pxPerMin, 20);
      const widthPct = 100/item.lanes;
      const leftPct = item.lane*widthPct;
      const borderColor = ui.calAnalyst==='all' && analyst ? analyst.color : 'var(--brand)';
      const draggable = s.status==='pendente';
      html += '<div class="cal-tg-event'+(due?' due':'')+'" draggable="'+(draggable?'true':'false')+'" data-draggable="'+(draggable?'1':'0')+'" style="top:'+top+'px;height:'+height+'px;left:'+leftPct+'%;width:calc('+widthPct+'% - 4px);border-left-color:'+borderColor+';" data-action="open-modal" data-modal="schedule-edit" data-id="'+s.id+'" title="'+esc(s.startTime+'–'+s.endTime+' · '+(client?client.name:'Interno')+' · '+s.type)+(draggable? ' (arraste para reagendar)':'')+'">'
        + '<div class="t">'+s.startTime+' '+esc(client?client.name:'Interno')+'</div>'
        + (height>34? '<div style="opacity:.8;">'+esc(s.type)+(ui.calAnalyst==='all'&&analyst? ' · '+esc(analyst.name):'')+'</div>' : '')
        + '</div>';
    });
    if(d===today && nowMin>=startHour*60 && nowMin<=endHour*60){
      html += '<div class="cal-tg-now" style="top:'+((nowMin-startHour*60)*pxPerMin)+'px;"></div>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  html += '</div></div>';
  return html;
}

      html += '<tr><td><span class="side-dot" style="background:'+a.color+';display:inline-block;"></span></td><td>'+esc(a.name)+'</td><td>'+esc(board?board.name:'—')+'</td>'
        + '<td><div class="row-actions"><button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="analyst-edit" data-id="'+a.id+'">Editar</button><button class="btn btn-sm btn-danger" data-action="delete-analyst" data-id="'+a.id+'">Excluir</button></div></td></tr>';
    });
    html += '</tbody></table><div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="analyst-new">+ Novo analista</button></div></div>';
  } else if(ui.settingsTab==='produtos'){
    html += '<div class="section-card"><h3>Produtos contratados — cadastro</h3>';
    if(!state.productTags.length){
      html += '<p class="hint" style="margin-top:-2px;">Nenhum produto cadastrado ainda.</p>';
    } else {
      html += '<table><thead><tr><th></th><th>Produto</th><th>Clientes vinculados</th><th></th></tr></thead><tbody>';
      state.productTags.forEach(t=>{
        const linkedCards = cardsUsingProduct(t.id);
        const names = linkedCards.map(c=>{ const cl=getClient(c.clientId); return esc(cl?cl.name:'—'); });
        const canDelete = linkedCards.length===0;
        html += '<tr><td><span class="side-dot" style="background:'+t.color+';display:inline-block;"></span></td>'
          + '<td style="font-weight:700;">'+esc(t.name)+'</td>'
          + '<td>'+(names.length? names.join(', ') : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td><div class="row-actions">'
            + '<button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="product-edit" data-id="'+t.id+'">Editar</button>'
            + '<button class="btn btn-sm btn-danger" data-action="delete-product" data-id="'+t.id+'" '+(canDelete?'':'disabled title="Não é possível excluir: há cliente(s) vinculado(s) a este produto."')+'>Excluir</button>'
            + '</div></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="product-new">+ Novo produto</button></div></div>';
  } else if(ui.settingsTab==='modulos'){
    html += '<div class="section-card"><h3>Módulos do sistema — cadastro</h3>';
    if(!state.modules.length){
      html += '<p class="hint" style="margin-top:-2px;">Nenhum módulo cadastrado ainda.</p>';
    } else {
      html += '<table><thead><tr><th>Módulo</th><th>Agendamentos vinculados</th><th></th></tr></thead><tbody>';
      state.modules.forEach(m=>{
        const linked = schedulesUsingModule(m.name);
        const clientNames = clientNamesForSchedules(linked);
        const linkedScreens = screensForModule(m.id);
        const canDelete = linked.length===0 && linkedScreens.length===0;
        const blockTitle = linked.length ? 'Não é possível excluir: há agendamento(s) usando este módulo.' : (linkedScreens.length ? 'Não é possível excluir: há tela(s) cadastrada(s) neste módulo.' : '');
        html += '<tr><td style="font-weight:700;">'+esc(m.name)+'</td>'
          + '<td>'+(linked.length ? (linked.length+' agendamento(s)'+(clientNames.length? ' — '+clientNames.map(esc).join(', '):'')) : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td><div class="row-actions">'
            + '<button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="module-edit" data-id="'+m.id+'">Editar</button>'
            + '<button class="btn btn-sm btn-danger" data-action="delete-module" data-id="'+m.id+'" '+(canDelete?'':'disabled title="'+esc(blockTitle)+'"')+'>Excluir</button>'
            + '</div></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="module-new">+ Novo módulo</button></div></div>';
  } else if(ui.settingsTab==='telas'){
    html += '<div class="section-card"><h3>Telas — cadastro</h3>';
    if(!state.modules.length){
      html += '<p class="hint" style="margin-top:-2px;">Cadastre um módulo primeiro — toda tela precisa estar vinculada a um módulo.</p>';
    } else if(!state.screens.length){
      html += '<p class="hint" style="margin-top:-2px;">Nenhuma tela cadastrada ainda.</p>';
    } else {
      html += '<table><thead><tr><th>Tela</th><th>Módulo</th><th>Agendamentos vinculados</th><th></th></tr></thead><tbody>';
      state.screens.forEach(scr=>{
        const mod = byId(state.modules, scr.moduleId);
        const linked = schedulesUsingScreen(scr.name);
        const clientNames = clientNamesForSchedules(linked);
        const canDelete = linked.length===0;
        html += '<tr><td style="font-weight:700;">'+esc(scr.name)+'</td><td>'+esc(mod?mod.name:'—')+'</td>'
          + '<td>'+(linked.length ? (linked.length+' agendamento(s)'+(clientNames.length? ' — '+clientNames.map(esc).join(', '):'')) : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td><div class="row-actions">'
            + '<button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="screen-edit" data-id="'+scr.id+'">Editar</button>'
            + '<button class="btn btn-sm btn-danger" data-action="delete-screen" data-id="'+scr.id+'" '+(canDelete?'':'disabled title="Não é possível excluir: há agendamento(s) usando esta tela."')+'>Excluir</button>'
            + '</div></td></tr>';
      });
      html += '</tbody></table>';
    }
    if(state.modules.length){
      html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="screen-new">+ Nova tela</button></div>';
    }
    html += '</div>';
  } else if(ui.settingsTab==='tipos'){
    html += '<div class="section-card"><h3>Tipos de agenda — cadastro</h3>';
    if(!state.agendaTypes.length){
      html += '<p class="hint" style="margin-top:-2px;">Nenhum tipo cadastrado ainda.</p>';
    } else {
      html += '<table><thead><tr><th>Tipo</th><th>Agendamentos vinculados</th><th></th></tr></thead><tbody>';
      state.agendaTypes.forEach(t=>{
        const linked = schedulesUsingType(t.name);
        const clientNames = clientNamesForSchedules(linked);
        const canDelete = linked.length===0;
        html += '<tr><td style="font-weight:700;">'+esc(t.name)+'</td>'
          + '<td>'+(linked.length ? (linked.length+' agendamento(s)'+(clientNames.length? ' — '+clientNames.map(esc).join(', '):'')) : '<span class="hint">Nenhum</span>')+'</td>'
          + '<td><div class="row-actions">'
            + '<button class="btn btn-sm btn-ghost" data-action="open-modal" data-modal="type-edit" data-id="'+t.id+'">Editar</button>'
            + '<button class="btn btn-sm btn-danger" data-action="delete-type" data-id="'+t.id+'" '+(canDelete?'':'disabled title="Não é possível excluir: há agendamento(s) usando este tipo."')+'>Excluir</button>'
            + '</div></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" data-action="open-modal" data-modal="type-new">+ Novo tipo</button></div></div>';
  } else if(ui.settingsTab==='nuvem'){
    html += '<div class="section-card"><h3>Sincronização na nuvem</h3>';
    const hasDefault = !!(DEFAULT_CLOUD_CONFIG.url && DEFAULT_CLOUD_CONFIG.anonKey);
    if(cloudStatus==='connected'){
      html += '<p class="hint" style="margin-top:-2px;">☁ Conectado'+(usingDefaultCloud?' à nuvem padrão deste site':' a uma nuvem configurada manualmente neste navegador')+'. Os dados deste app são salvos em um banco de dados na nuvem (Supabase) e ficam disponíveis em qualquer navegador ou dispositivo que abra esta mesma página.</p>'
        + '<button class="btn btn-danger btn-sm" data-action="cloud-disconnect" style="margin-top:10px;">Desconectar (voltar a salvar só neste navegador)</button>';
    } else {
      if(cloudStatus==='error') html += '<div class="error-msg">'+esc(cloudErrorMsg)+'</div>';
      if(hasDefault){
        html += '<p class="hint" style="margin-top:-2px;">Este navegador está configurado para salvar só localmente (você desconectou da nuvem padrão deste site, ou a conexão falhou).</p>'
          + '<button class="btn btn-primary btn-sm" data-action="cloud-reconnect-default" style="margin-bottom:16px;">Reconectar à nuvem deste site</button>';
      } else {
        html += '<p class="hint" style="margin-top:-2px;">Por padrão, os dados ficam salvos só neste navegador. Para acessar de outros computadores/dispositivos com os mesmos dados, conecte a um banco de dados gratuito no Supabase.</p>';
      }
      html += '<form data-form="cloud-config">'
        + '<div class="field"><label>Project URL</label><input type="text" name="url" placeholder="https://xxxxx.supabase.co" value="'+esc(cloudConfig?cloudConfig.url:'')+'" required></div>'
        + '<div class="field"><label>Anon public key</label><input type="text" name="anonKey" placeholder="eyJhbGci..." value="'+esc(cloudConfig?cloudConfig.anonKey:'')+'" required></div>'
        + '<div class="form-actions"><span style="flex:1;"></span><button type="submit" class="btn btn-primary">Conectar</button></div>'
        + '</form>'
        + '<p class="hint">Veja o passo a passo de como criar o banco gratuito e obter esses dados na conversa com o Claude que gerou este app.</p>';
    }
    html += '</div>';
  }
  return html;
}

/* ============================= MODALS ============================= */
function renderModal(){
  const m = ui.modal;
  let inner = '';
  if(m.type==='analyst-new' || m.type==='analyst-edit'){
    const a = m.type==='analyst-edit' ? getAnalyst(m.id) : null;
    inner = '<div class="modal-header"><h3>'+(a?'Editar analista':'Novo analista')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="analyst" data-id="'+(a?a.id:'')+'">'
      + '<div class="field"><label>Nome</label><input type="text" name="name" value="'+esc(a?a.name:'')+'" required></div>'
      + '<div class="field"><label>Cor</label><input type="color" name="color" value="'+(a?a.color:colorForIndex(state.analysts.length))+'"></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='client-new' || m.type==='client-edit'){
    const c = m.type==='client-edit' ? getClient(m.id) : null;
    const ctype = c ? (c.clientType||'novo') : 'novo';
    inner = '<div class="modal-header"><h3>'+(c?'Editar cliente':'Novo cliente')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="client" data-id="'+(c?c.id:'')+'" data-then="'+(m.then||'')+'">'
      + '<div class="field"><label>Nome</label><input type="text" name="name" value="'+esc(c?c.name:'')+'" required></div>'
      + '<div class="field-row"><div class="field"><label>Segmento</label><input type="text" name="segment" value="'+esc(c?c.segment:'')+'" placeholder="Ex: Varejo, Alimentício..."></div><div class="field"><label>Cidade</label><input type="text" name="city" value="'+esc(c?c.city:'')+'"></div></div>'
      + '<div class="field"><label>Tipo de cliente</label><select name="clientType">'
        + '<option value="novo" '+(ctype==='novo'?'selected':'')+'>Cliente novo</option>'
        + '<option value="base" '+(ctype==='base'?'selected':'')+'>Cliente da base</option>'
        + '</select></div>'
      + '<div class="field"><label>Contato (pessoa)</label><input type="text" name="contact" value="'+esc(c?c.contact:'')+'"></div>'
      + '<div class="field-row"><div class="field"><label>E-mail</label><input type="email" name="email" value="'+esc(c?c.email:'')+'"></div><div class="field"><label>Telefone</label><input type="tel" name="phone" value="'+esc(c?c.phone:'')+'"></div></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='product-new' || m.type==='product-edit'){
    const p = m.type==='product-edit' ? byId(state.productTags, m.id) : null;
    inner = '<div class="modal-header"><h3>'+(p?'Editar produto':'Novo produto')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="product" data-id="'+(p?p.id:'')+'">'
      + '<div class="field"><label>Nome do produto</label><input type="text" name="name" value="'+esc(p?p.name:'')+'" required></div>'
      + '<div class="field"><label>Cor</label><input type="color" name="color" value="'+(p?p.color:colorForIndex(state.productTags.length))+'"></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='module-new' || m.type==='module-edit'){
    const md = m.type==='module-edit' ? byId(state.modules, m.id) : null;
    inner = '<div class="modal-header"><h3>'+(md?'Editar módulo':'Novo módulo')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="module" data-id="'+(md?md.id:'')+'">'
      + '<div class="field"><label>Nome do módulo</label><input type="text" name="name" value="'+esc(md?md.name:'')+'" required></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='screen-new' || m.type==='screen-edit'){
    const scr = m.type==='screen-edit' ? byId(state.screens, m.id) : null;
    inner = '<div class="modal-header"><h3>'+(scr?'Editar tela':'Nova tela')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="screen" data-id="'+(scr?scr.id:'')+'">'
      + '<div class="field"><label>Nome da tela</label><input type="text" name="name" value="'+esc(scr?scr.name:'')+'" required></div>'
      + '<div class="field"><label>Módulo</label><select name="moduleId">';
    state.modules.forEach(md=> inner += '<option value="'+md.id+'" '+(scr && scr.moduleId===md.id?'selected':'')+'>'+esc(md.name)+'</option>');
    inner += '</select></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='type-new' || m.type==='type-edit'){
    const tp = m.type==='type-edit' ? byId(state.agendaTypes, m.id) : null;
    inner = '<div class="modal-header"><h3>'+(tp?'Editar tipo':'Novo tipo')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="agenda-type" data-id="'+(tp?tp.id:'')+'">'
      + '<div class="field"><label>Nome do tipo</label><input type="text" name="name" value="'+esc(tp?tp.name:'')+'" required></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Salvar</button></div></form>';
  } else if(m.type==='list-new'){
    inner = '<div class="modal-header"><h3>Nova lista</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="list-new" data-board="'+m.board+'"><div class="field"><label>Nome da lista</label><input type="text" name="name" required></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Criar</button></div></form>';
  } else if(m.type==='card-new'){
    const board = getBoard(m.board);
    inner = '<div class="modal-header"><h3>Novo cliente no quadro</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<form data-form="card-new" data-board="'+m.board+'" data-list="'+(m.list||board.lists[0].id)+'">'
      + '<div class="field"><label>Cliente</label><select name="clientId"><option value="">— Criar novo cliente —</option>';
    state.clients.forEach(cl=> inner += '<option value="'+cl.id+'">'+esc(cl.name)+'</option>');
    inner += '</select></div>'
      + '<div class="field" id="new-client-name-field"><label>Nome do novo cliente</label><input type="text" name="newClientName" placeholder="Obrigatório se não selecionar um cliente acima"></div>'
      + '<div class="field-row"><div class="field"><label>Horas contratadas</label><input type="number" min="0" step="0.5" name="contractedHours" value="0"></div><div class="field"><label>Início da implantação</label><input type="date" name="startDate" value="'+todayISO()+'"></div></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Criar card</button></div></form>';
  } else if(m.type==='schedule-new' || m.type==='schedule-edit'){
    inner = renderScheduleForm(m);
  } else if(m.type==='confirm-complete'){
    const s = byId(state.schedules, m.id);
    const dur = timeToMin(s.endTime)-timeToMin(s.startTime);
    inner = '<div class="modal-header"><h3>Confirmar conclusão</h3><button class="modal-close" data-action="close-modal">✕</button></div>'
      + '<p class="hint" style="margin-top:-6px;">'+fmtDateBR(s.date)+' · '+s.startTime+'–'+s.endTime+' · '+esc(s.type)+'</p>'
      + '<form data-form="confirm-complete" data-id="'+s.id+'">'
      + '<div class="field"><label>Minutos a abater do saldo</label><input type="number" min="0" name="deductMinutes" value="'+dur+'"></div>'
      + '<div class="field"><label>Observação (opcional)</label><textarea name="notes"></textarea></div>'
      + '<div class="form-actions"><button type="submit" class="btn btn-primary">Confirmar conclusão</button></div></form>';
  }
  return '<div class="overlay"><div class="modal'+(m.type&&m.type.startsWith('schedule')?' wide':'')+'">'+inner+'</div></div>';
}

function renderScheduleForm(m){
  const editing = m.type==='schedule-edit' ? byId(state.schedules, m.id) : null;
  const readOnly = false;
  const cardCtx = m.card ? getCard(m.card) : (editing && editing.cardId ? getCard(editing.cardId) : null);
  const fixedAnalystId = cardCtx ? getBoard(cardCtx.boardId).analystId : (editing ? editing.analystId : '');
  const draft = m.values || null;
  const eff = {
    clientId: draft ? (draft.clientId||'') : (editing ? editing.clientId||'' : ''),
    analystId: draft ? (draft.analystId || fixedAnalystId) : (fixedAnalystId || m.prefillAnalyst || ''),
    date: draft ? draft.date : (editing ? editing.date : (m.prefillDate || todayISO())),
    startTime: draft ? draft.startTime : (editing ? editing.startTime : (m.prefillStart || '09:00')),
    endTime: draft ? draft.endTime : (editing ? editing.endTime : (m.prefillEnd || '10:00')),
    type: draft ? draft.type : (editing ? editing.type : (state.agendaTypes[0] ? state.agendaTypes[0].name : '')),
    modules: draft ? (draft.modules||[]) : (editing ? (editing.modules||[]) : []),
    trainedScreens: draft ? (draft.trainedScreens||[]) : (editing ? (editing.trainedScreens||[]) : []),
    trainedUsers: draft ? (draft.trainedUsers||'') : (editing ? (editing.trainedUsers||'') : ''),
    notes: draft ? (draft.notes||'') : (editing ? editing.notes : '')
  };
  let html = '<div class="modal-header"><h3>'+(editing?'Editar agendamento':'Novo agendamento')+'</h3><button class="modal-close" data-action="close-modal">✕</button></div>';
  if(editing) html += '<p class="hint" style="margin-top:-8px;">Status: <span class="badge '+editing.status+'">'+statusLabel(editing.status)+'</span>'+(editing.status==='concluida'? ' · '+minToHM(editing.deductMinutes)+' abatido(s)':'')+'</p>';
  if(ui.formErr){ html += '<div class="error-msg">'+esc(ui.formErr)+'</div>'; }
  html += '<form data-form="schedule" data-id="'+(editing?editing.id:'')+'" data-card="'+(cardCtx?cardCtx.id:'')+'">';

  if(cardCtx){
    const client = getClient(cardCtx.clientId);
    html += '<div class="field"><label>Cliente</label><input type="text" value="'+esc(client?client.name:'')+'" disabled></div>';
  } else {
    html += '<div class="field"><label>Cliente (opcional)</label><select name="clientId"><option value="">Interno / sem cliente</option>';
    state.clients.forEach(cl=> html += '<option value="'+cl.id+'" '+(eff.clientId===cl.id?'selected':'')+'>'+esc(cl.name)+'</option>');
    html += '</select></div>';
  }
  html += '<div class="field"><label>Analista</label><select name="analystId" '+(cardCtx?'disabled':'')+'>';
  state.analysts.forEach(a=> html += '<option value="'+a.id+'" '+((eff.analystId===a.id)?'selected':'')+'>'+esc(a.name)+'</option>');
  html += '</select></div>';
  html += '<div class="field-row">'
    + '<div class="field"><label>Data</label><input type="date" name="date" value="'+esc(eff.date)+'"></div>'
    + '<div class="field"><label>Início</label><input type="time" name="startTime" value="'+esc(eff.startTime)+'"></div>'
    + '<div class="field"><label>Fim</label><input type="time" name="endTime" value="'+esc(eff.endTime)+'"></div>'
    + '</div>';
  html += '<div class="field"><label>Tipo</label><select name="type">';
  state.agendaTypes.forEach(t=> html += '<option value="'+esc(t.name)+'" '+(eff.type===t.name?'selected':'')+'>'+esc(t.name)+'</option>');
  html += '</select></div>';
  html += '<div class="field"><label>Módulo(s) do sistema</label><div class="check-grid">';
  state.modules.forEach(mod=>{
    const checked = eff.modules.includes(mod.name) ? 'checked':'';
    html += '<label class="check-pill"><input type="checkbox" name="modules" value="'+esc(mod.name)+'" '+checked+'>'+esc(mod.name)+'</label>';
  });
  html += '</div>';
  if(!readOnly){
    html += '<div style="display:flex;gap:6px;margin-top:9px;">'
      + '<input type="text" class="quick-add-input" data-for="module" placeholder="Novo módulo...">'
      + '<button type="button" class="btn btn-sm btn-primary" data-action="quick-add-module">+ Adicionar</button>'
      + '</div>';
  }
  html += '</div>';
  const checkedModules = state.modules.filter(m=> eff.modules.includes(m.name));
  checkedModules.forEach(mod=>{
    const screensForMod = screensForModule(mod.id);
    if(!screensForMod.length) return;
    html += '<div class="field"><label>Telas treinadas — '+esc(mod.name)+'</label><div class="check-grid">';
    screensForMod.forEach(scr=>{
      const checked = eff.trainedScreens.includes(scr.name) ? 'checked':'';
      html += '<label class="check-pill"><input type="checkbox" name="trainedScreens" value="'+esc(scr.name)+'" '+checked+'>'+esc(scr.name)+'</label>';
    });
    html += '</div></div>';
  });
  html += '<div class="field"><label>Usuários treinados</label><textarea name="trainedUsers" placeholder="Nomes das pessoas que receberam o treinamento, separados por vírgula">'+esc(eff.trainedUsers)+'</textarea><span class="hint" style="margin-top:2px;">Para identificar quem do cliente participou do treinamento.</span></div>';
  html += '<div class="field"><label>Observações</label><textarea name="notes">'+esc(eff.notes)+'</textarea></div>';
  if(!readOnly){
    let quick = '';
    if(editing && editing.status==='pendente'){
      quick = '<button type="button" class="btn btn-sm btn-primary" data-action="open-modal" data-modal="confirm-complete" data-id="'+editing.id+'">Concluir agora</button>'
        + '<button type="button" class="btn btn-sm btn-ghost" data-action="mark-not-done" data-id="'+editing.id+'">Não realizada</button>';
    } else if(editing){
      quick = '<button type="button" class="btn btn-sm btn-ghost" data-action="revert-to-pending" data-id="'+editing.id+'">'+(editing.status==='concluida'?'Reverter conclusão':'Reverter p/ pendente')+'</button>';
    }
    html += '<div class="form-actions">'+quick+(editing?'<button type="button" class="btn btn-danger" data-action="delete-schedule" data-id="'+editing.id+'">Excluir</button>':'')+'<span style="flex:1;"></span><button type="submit" class="btn btn-primary">Salvar agendamento</button></div>';
  }
  html += '</form>';
  return html;
}

/* ============================= EVENT HANDLING ============================= */
function closeModal(){ ui.modal=null; ui.formErr=''; render(); }
function showConfirm(message, onConfirm){ ui.confirmDialog = {message, onConfirm, alertOnly:false}; render(); }
function showAlert(message){ ui.confirmDialog = {message, onConfirm:null, alertOnly:true}; render(); }
function renderConfirmDialog(){
  const d = ui.confirmDialog;
  const buttons = d.alertOnly
    ? '<button class="btn btn-primary" data-action="confirm-ok">OK</button>'
    : '<button class="btn btn-ghost" data-action="confirm-cancel">Cancelar</button><button class="btn btn-primary" data-action="confirm-ok">Confirmar</button>';
  return '<div class="overlay confirm-overlay"><div class="modal" style="max-width:420px;">'
    + '<p style="margin:4px 0 18px;white-space:pre-line;">'+esc(d.message)+'</p>'
    + '<div class="form-actions">'+buttons+'</div>'
    + '</div></div>';
}

document.addEventListener('click', function(e){
  let needsRender = false;
  const notifPanelClick = e.target.closest('.notif-panel');
  const bellClick = e.target.closest('[data-action="toggle-notif"]');
  if(ui.showNotif && !notifPanelClick && !bellClick){ ui.showNotif=false; needsRender = true; }

  if(e.target.classList && e.target.classList.contains('overlay')){
    if(e.target.classList.contains('card-overlay')){ ui.openCardId=null; render(); return; }
    if(e.target.classList.contains('confirm-overlay')){ ui.confirmDialog=null; render(); return; }
    closeModal(); return;
  }
  const el = e.target.closest('[data-action]');
  if(!el){ if(needsRender) render(); return; }
  const a = el.dataset.action;

  if(a==='goto-view'){ ui.view = el.dataset.view; ui.showNotif=false; render(); }
  else if(a==='open-board'){ ui.view='board'; ui.currentBoardId = el.dataset.id; ui.search=''; render(); }
  else if(a==='open-modal'){
    const type = el.dataset.modal;
    ui.formErr='';
    ui.modal = {type, id:el.dataset.id, board:el.dataset.board, list:el.dataset.list, card:el.dataset.card};
    render();
  }
  else if(a==='close-modal' || a==='close-modal-bg'){ closeModal(); }
  else if(a==='confirm-ok'){ const d=ui.confirmDialog; ui.confirmDialog=null; if(d && d.onConfirm) d.onConfirm(); render(); }
  else if(a==='confirm-cancel'){ ui.confirmDialog=null; render(); }
  else if(a==='close-card'){ ui.openCardId=null; ui.cardDraft=null; render(); }
  else if(a==='toggle-notif'){ ui.showNotif = !ui.showNotif; render(); }
  else if(a==='open-card'){ const holder = el.closest('[data-card-id]'); if(holder){ if(ui.cardDraft && ui.cardDraft.cardId!==holder.dataset.cardId) ui.cardDraft=null; ui.openCardId = holder.dataset.cardId; ui.cardTab='info'; render(); } }
  else if(a==='card-tab'){ ui.cardTab = el.dataset.tab; render(); }
  else if(a==='delete-card'){
    const id = el.dataset.id;
    showConfirm('Excluir este card e seus agendamentos vinculados?', function(){ deleteCard(id); ui.openCardId=null; ui.cardDraft=null; ui.modal=null; });
  }
  else if(a==='quick-add-product'){
    const form = el.closest('form[data-form="card-info"]');
    const input = form.querySelector('.quick-add-input[data-for="product"]');
    const colorInput = form.querySelector('.quick-add-color[data-for="product"]');
    const name = (input.value||'').trim();
    if(!name){ input.focus(); return; }
    const values = captureFormValues(form);
    const newTag = {id:uid('pt'), name, color: colorInput ? colorInput.value : colorForIndex(state.productTags.length)};
    state.productTags.push(newTag);
    values.productTags = (values.productTags||[]).concat(newTag.id);
    ui.cardDraft = {cardId: form.dataset.card, values};
    render();
  }
  else if(a==='quick-add-module'){
    const form = el.closest('form[data-form="schedule"]');
    const input = form.querySelector('.quick-add-input[data-for="module"]');
    const name = (input.value||'').trim();
    if(!name){ input.focus(); return; }
    const values = captureFormValues(form);
    if(!state.modules.some(m=>m.name===name)) state.modules.push({id:uid('md'), name});
    values.modules = (values.modules||[]).concat(name);
    ui.modal.values = values;
    render();
  }
  else if(a==='delete-list'){ deleteListFromBoard(el.dataset.board, el.dataset.list); render(); }
  else if(a==='delete-analyst'){
    const id = el.dataset.id;
    showConfirm('Excluir este analista, seu quadro e todos os cards/agendamentos vinculados?', function(){
      deleteAnalyst(id);
      if(ui.currentBoardId && !getBoard(ui.currentBoardId)) ui.currentBoardId = state.boards[0]?state.boards[0].id:null;
    });
  }
  else if(a==='delete-client'){
    const id = el.dataset.id;
    showConfirm('Excluir este cliente e seus cards vinculados?', function(){ deleteClient(id); });
  }
  else if(a==='delete-schedule'){
    const id = el.dataset.id;
    showConfirm('Excluir este agendamento?', function(){ deleteSchedule(id); ui.modal=null; });
  }
  else if(a==='mark-not-done'){ markNotDone(el.dataset.id); render(); }
  else if(a==='revert-to-pending'){
    const id = el.dataset.id;
    const s = byId(state.schedules, id);
    const msg = s && s.status==='concluida'
      ? 'Reverter a conclusão desta agenda? O saldo de horas será estornado e ela voltará para pendente.'
      : 'Reverter esta agenda para pendente?';
    showConfirm(msg, function(){ revertToPending(id); ui.modal=null; });
  }
  else if(a==='delete-product'){
    const tagId = el.dataset.id;
    const linked = cardsUsingProduct(tagId);
    if(linked.length){
      const names = linked.map(c=>{ const cl=getClient(c.clientId); return cl?cl.name:'—'; });
      showAlert('Não é possível excluir: este produto está vinculado a '+linked.length+' cliente(s) — '+names.join(', ')+'. Remova o produto desses clientes antes de excluí-lo.');
    } else {
      showConfirm('Excluir este produto do cadastro?', function(){ state.productTags = state.productTags.filter(t=>t.id!==tagId); });
    }
  }
  else if(a==='delete-module'){
    const id = el.dataset.id;
    const mod = byId(state.modules, id);
    if(!mod) return;
    const linked = schedulesUsingModule(mod.name);
    const linkedScreens = screensForModule(id);
    if(linked.length){
      showAlert('Não é possível excluir: este módulo está sendo usado em '+linked.length+' agendamento(s). Remova-o desses agendamentos antes de excluir.');
    } else if(linkedScreens.length){
      showAlert('Não é possível excluir: este módulo tem '+linkedScreens.length+' tela(s) cadastrada(s) — '+linkedScreens.map(s=>s.name).join(', ')+'. Exclua ou reatribua essas telas primeiro.');
    } else {
      showConfirm('Excluir este módulo do cadastro?', function(){ state.modules = state.modules.filter(m=>m.id!==id); });
    }
  }
  else if(a==='delete-screen'){
    const id = el.dataset.id;
    const scr = byId(state.screens, id);
    if(!scr) return;
    const linked = schedulesUsingScreen(scr.name);
    if(linked.length){
      showAlert('Não é possível excluir: esta tela está marcada como treinada em '+linked.length+' agendamento(s). Remova-a desses agendamentos antes de excluir.');
    } else {
      showConfirm('Excluir esta tela do cadastro?', function(){ state.screens = state.screens.filter(s=>s.id!==id); });
    }
  }
  else if(a==='cloud-disconnect'){ showConfirm('Desconectar da nuvem? O app volta a salvar só neste navegador (os dados na nuvem continuam existindo).', function(){ disconnectCloud(); }); }
  else if(a==='force-save'){ forceSaveNow(); }
  else if(a==='cloud-reconnect-default'){ connectCloud(DEFAULT_CLOUD_CONFIG.url, DEFAULT_CLOUD_CONFIG.anonKey); }
  else if(a==='delete-type'){
    const id = el.dataset.id;
    const tp = byId(state.agendaTypes, id);
    if(!tp) return;
    const linked = schedulesUsingType(tp.name);
    if(linked.length){
      showAlert('Não é possível excluir: este tipo está sendo usado em '+linked.length+' agendamento(s). Remova-o desses agendamentos antes de excluir.');
    } else {
      showConfirm('Excluir este tipo do cadastro?', function(){ state.agendaTypes = state.agendaTypes.filter(t=>t.id!==id); });
    }
  }
  else if(a==='settings-tab'){ ui.settingsTab = el.dataset.tab; render(); }
  else if(a==='cal-nav'){ const dir=el.dataset.dir; if(dir==='0') ui.calStart=startOfWeekISO(todayISO()); else ui.calStart = addDaysISO(ui.calStart, 7*parseInt(dir,10)); render(); }
  else if(a==='cal-grid-click'){
    const rect = el.getBoundingClientRect();
    const offsetY = e.clientY - rect.top;
    const startHour = parseFloat(el.dataset.startHour);
    const pxPerHour = parseFloat(el.dataset.pxPerHour);
    let minutesFromStart = (offsetY/pxPerHour)*60;
    minutesFromStart = Math.round(minutesFromStart/30)*30;
    let totalMin = Math.max(0, Math.min(24*60-30, startHour*60 + minutesFromStart));
    const pad = n=>String(n).padStart(2,'0');
    const startH = Math.floor(totalMin/60), startM = totalMin%60;
    const endTotal = Math.min(24*60, totalMin+60);
    const endH = Math.floor(endTotal/60), endM = endTotal%60;
    ui.formErr = '';
    ui.modal = {
      type:'schedule-new',
      prefillDate: el.dataset.date,
      prefillStart: pad(startH)+':'+pad(startM),
      prefillEnd: pad(endH===24?23:endH)+':'+pad(endH===24?59:endM),
      prefillAnalyst: ui.calAnalyst!=='all' ? ui.calAnalyst : undefined
    };
    render();
  }
  else { render(); }
});

document.addEventListener('change', function(e){
  if(e.target.id==='cal-analyst-filter'){ ui.calAnalyst = e.target.value; render(); }
  else if(e.target.matches('select[name="moveTo"]')){
    const cardId = e.target.closest('form').dataset.card;
    const [boardId,listId] = e.target.value.split('::');

    render();
  }
  else if(e.target.matches('form[data-form="schedule"] input[name="modules"]')){
    // Re-render so the "telas treinadas" sub-section appears/disappears for the module just

    const form = e.target.closest('form');
    if(ui.modal){ ui.modal.values = captureFormValues(form); render(); }
  }
  else if(e.target.matches('select[name="clientId"]') && e.target.closest('#modal-holder')){
    // for card-new modal: toggle new-client-name requirement visually (no-op needed, submit handles logic)
  }

document.addEventListener('input', function(e){
  if(e.target.id==='search-input'){
    ui.search = e.target.value;
    ui._focus = {id:'search-input', pos: e.target.selectionStart};

});

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('quick-add-input')){
    e.preventDefault();
