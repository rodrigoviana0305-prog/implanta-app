<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Implanta — Gestão de Implantação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECEEED; --bg-soft:#E2E5E3; --surface:#FFFFFF; --surface-2:#F5F6F5;
  --border:#D8DCDA; --ink:#181D1A; --ink-soft:#5A635D; --ink-faint:#8B948D;
  --brand:#2F5D50; --brand-dark:#1F423A; --brand-soft:#DCE8E3;
  --gold:#B9812E; --gold-soft:#F3E3C6;
  --danger:#A73E27; --danger-soft:#F3DCD4;
  --ok:#2F5D50; --ok-soft:#DCE8E3;
  --radius-s:6px; --radius-m:10px; --radius-l:16px;
  --shadow-1:0 1px 2px rgba(24,29,26,.08),0 1px 1px rgba(24,29,26,.04);
  --shadow-2:0 12px 32px rgba(24,29,26,.18);
  --font-head:'Manrope',sans-serif; --font-body:'Inter',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A; --bg-soft:#1A1F21; --surface:#1F2528; --surface-2:#242B2E;
    --border:#343C3F; --ink:#EDEFEE; --ink-soft:#AEB6B2; --ink-faint:#78827E;
    --brand:#5FA48D; --brand-dark:#4A8B75; --brand-soft:#1F332C;
    --gold:#D9A85C; --gold-soft:#392E1A;
    --danger:#DB8770; --danger-soft:#3A241C;
    --ok:#5FA48D; --ok-soft:#1F332C;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#14181A; --bg-soft:#1A1F21; --surface:#1F2528; --surface-2:#242B2E;
  --border:#343C3F; --ink:#EDEFEE; --ink-soft:#AEB6B2; --ink-faint:#78827E;
  --brand:#5FA48D; --brand-dark:#4A8B75; --brand-soft:#1F332C;
  --gold:#D9A85C; --gold-soft:#392E1A;
  --danger:#DB8770; --danger-soft:#3A241C;
  --ok:#5FA48D; --ok-soft:#1F332C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{ font-family:inherit; font-size:14px; color:inherit; }
button{ cursor:pointer; }
h1,h2,h3,h4{ font-family:var(--font-head); margin:0; color:var(--ink); }
::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

.shell{ display:flex; height:100vh; width:100%; overflow:hidden; }

.sidebar{
  width:230px; flex:0 0 230px; background:var(--brand-dark); color:#EFF4F1;
  display:flex; flex-direction:column; padding:18px 14px; gap:18px; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:10px; padding:0 4px; }
.brand-mark{ width:30px;height:30px;border-radius:9px;background:var(--gold); display:flex;align-items:center;justify-content:center; font-family:var(--font-head); font-weight:800; color:#241a06; font-size:15px; flex:0 0 auto;}
.brand-name{ font-family:var(--font-head); font-weight:800; font-size:17px; letter-spacing:.2px; }
.side-section{ display:flex; flex-direction:column; gap:3px; }
.side-label{ font-size:11px; color:#B9CCC3; font-weight:600; padding:6px 8px 2px; display:flex; justify-content:space-between; align-items:center; }
.side-item{
  display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; border:none;
  background:transparent; color:#E4EEE9; text-align:left; width:100%; font-size:13.5px; font-weight:500;
}
.side-item:hover{ background:rgba(255,255,255,.08); }
.side-item.active{ background:rgba(255,255,255,.16); color:#fff; }
.side-item.inactive-analyst{ opacity:.5; }
.side-dot{ width:9px;height:9px;border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
.side-badge{ margin-left:auto; background:var(--gold); color:#241a06; font-size:11px; font-weight:800; border-radius:20px; padding:1px 7px; }
.side-badge.inativo{ background:#6B7A73; color:#E4EEE9; }
.side-add{ display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:8px; border:1px dashed rgba(255,255,255,.3); background:transparent; color:#CFE0D8; font-size:13px; width:100%; }
.side-add:hover{ background:rgba(255,255,255,.06); }
.side-spacer{ flex:1; }
.side-foot{ font-size:11px; color:#9FB6AC; padding:6px 8px; line-height:1.5; }

.main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 22px; background:var(--surface);
  border-bottom:1px solid var(--border); flex:0 0 auto;
}
.topbar h2{ font-size:19px; }
.topbar .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:1px; }
.topbar-title{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; position:relative; }
.search-box{
  display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:7px 11px; min-width:200px;
}
.search-box input{ border:none; background:transparent; outline:none; width:100%; color:var(--ink); }
.icon-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid var(--border); background:var(--surface-2);
  display:flex;align-items:center;justify-content:center; position:relative; flex:0 0 auto;
}
.icon-btn:hover{ background:var(--bg-soft); }
.notif-dot{ position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:800; border-radius:20px; min-width:16px; height:16px; display:flex;align-items:center;justify-content:center; padding:0 3px; }
.view{ flex:1; overflow:auto; padding:20px 22px 40px; }

.btn{ border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink); padding:8px 14px; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;}
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
.btn-primary:hover{ background:var(--brand-dark); }
.btn-gold{ background:var(--gold); border-color:var(--gold); color:#241a06; }
.btn-gold:hover{ filter:brightness(0.95); }
.btn-danger{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
.btn-danger:hover{ background:var(--danger); color:#fff; }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-sm{ padding:5px 10px; font-size:12.5px; border-radius:7px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.board-lists{ display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:16px; min-height:60vh; }
.list-col{ background:var(--bg-soft); border-radius:var(--radius-m); width:270px; flex:0 0 270px; display:flex; flex-direction:column; max-height:calc(100vh - 190px); }
.list-head{ display:flex; align-items:center; gap:8px; padding:11px 12px 7px; }
.list-head .name{ font-weight:700; font-size:13.5px; flex:1; }
.list-head .count{ font-size:11.5px; color:var(--ink-faint); background:var(--surface); border-radius:20px; padding:1px 8px; }
.list-cards{ flex:1; overflow-y:auto; padding:2px 10px; display:flex; flex-direction:column; gap:9px; min-height:40px; }
.list-cards.drag-over{ background:var(--brand-soft); border-radius:8px; }
.card-mini{ background:var(--surface); border-radius:9px; padding:10px 11px; box-shadow:var(--shadow-1); cursor:grab; border:1px solid transparent; display:flex; flex-direction:column; gap:6px; }
.card-mini:hover{ border-color:var(--border); }
.card-mini.dragging{ opacity:.4; }
.chip-row{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; color:#fff; letter-spacing:.2px; }
.card-title{ font-weight:700; font-size:13.5px; color:var(--ink); }
.card-meta{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-soft); }
.balance-pill{ font-weight:700; padding:1px 7px; border-radius:20px; background:var(--ok-soft); color:var(--ok); }
.balance-pill.neg{ background:var(--danger-soft); color:var(--danger); }
.pending-flag{ color:var(--danger); font-weight:700; display:flex; align-items:center; gap:3px; }
.add-card-btn{ margin:4px 10px 10px; padding:8px 10px; border-radius:8px; background:transparent; border:1px dashed var(--border); color:var(--ink-soft); text-align:left; font-size:13px; }
.add-card-btn:hover{ background:var(--surface); color:var(--ink); }
.list-add-col{ width:230px; flex:0 0 230px; }
.list-add-col button{ width:100%; padding:11px; border-radius:var(--radius-m); border:1.5px dashed var(--border); background:transparent; color:var(--ink-soft); font-weight:600; }
.list-add-col button:hover{ background:var(--surface); }

.empty-state{ text-align:center; padding:70px 20px; max-width:440px; margin:0 auto; }
.empty-state h3{ font-size:20px; margin-bottom:8px; }
.empty-state p{ color:var(--ink-soft); margin-bottom:20px; }

.overlay{ position:fixed; inset:0; background:rgba(15,20,17,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100; }
.overlay.card-overlay{ z-index:90; }
.overlay.confirm-overlay{ z-index:300; }
.modal{ background:var(--surface); border-radius:var(--radius-l); box-shadow:var(--shadow-2); width:100%; max-width:520px; padding:22px 24px 24px; }
.modal.wide{ max-width:680px; }
.modal-header{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
.modal-header h3{ font-size:18px; flex:1; }
.modal-close{ background:none;border:none;font-size:20px;color:var(--ink-faint); line-height:1; padding:2px 4px;}
.modal-close:hover{ color:var(--ink); }
.field{ margin-bottom:13px; display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field input[type=email], .field input[type=tel], .field input[type=password], .field select, .field textarea{
  border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:var(--surface-2); color:var(--ink); outline:none; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--brand); background:var(--surface); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }
.check-grid{ display:flex; flex-wrap:wrap; gap:8px; }
.check-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12.5px; background:var(--surface-2); }
.check-pill input{ accent-color:var(--brand); }
.form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.error-msg{ background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:8px 11px; font-size:12.5px; font-weight:600; margin-bottom:12px; white-space:pre-line; }
input[type=color]{ width:38px; height:32px; padding:2px; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); }

.card-modal-top{ display:flex; align-items:flex-start; gap:12px; }
.card-modal-meta{ font-size:12.5px; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin:16px 0 16px; }
.tab-btn{ background:none; border:none; padding:9px 4px; margin-right:16px; font-weight:700; color:var(--ink-faint); border-bottom:2px solid transparent; }
.tab-btn.active{ color:var(--brand); border-color:var(--brand); }
.balance-box{ display:flex; gap:10px; margin-bottom:16px; }
.balance-item{ flex:1; background:var(--surface-2); border-radius:10px; padding:11px 13px; text-align:center; }
.balance-item .num{ font-family:var(--font-head); font-weight:800; font-size:19px; }
.balance-item .lbl{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
.sched-row{ display:flex; align-items:center; gap:10px; padding:10px 11px; border:1px solid var(--border); border-radius:9px; margin-bottom:8px; background:var(--surface-2); }
.sched-row.due{ border-color:var(--danger); background:var(--danger-soft); }
.sched-main{ flex:1; min-width:0; }
.sched-time{ font-weight:700; font-size:13px; }
.sched-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.badge{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
.badge.pendente{ background:var(--gold-soft); color:var(--gold); }
.badge.concluida{ background:var(--ok-soft); color:var(--ok); }
.badge.nao_realizada{ background:var(--danger-soft); color:var(--danger); }
.hist-row{ padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.hist-row .ts{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
.row-actions{ display:flex; gap:5px; flex:0 0 auto; }

.cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.cal-toolbar .grow{ flex:1; }
.cal-tg-outer{ border:1px solid var(--border); border-radius:10px; overflow-x:auto; overflow-y:hidden; background:var(--surface); }
.cal-tg-inner{ min-width:680px; }
.cal-tg-headerrow{ display:grid; grid-template-columns:56px repeat(7,1fr); border-bottom:1px solid var(--border); background:var(--surface); }
.cal-tg-daycol-head{ padding:8px 6px; text-align:center; border-left:1px solid var(--border); }
.cal-tg-daycol-head .wd{ font-size:10.5px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; }
.cal-tg-daycol-head .dt{ font-family:var(--font-head); font-weight:800; font-size:14px; }
.cal-tg-daycol-head.today .dt{ color:var(--brand); }
.cal-tg-bodyscroll{ max-height:64vh; overflow-y:auto; }
.cal-tg-bodyrow{ display:grid; grid-template-columns:56px repeat(7,1fr); position:relative; }
.cal-tg-hourlabels{ position:relative; }
.cal-tg-hourlabel{ position:absolute; right:8px; transform:translateY(-50%); font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
.cal-tg-daycol{ position:relative; border-left:1px solid var(--border); cursor:pointer; background-image:repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent var(--hour-px)); }
.cal-tg-daycol:hover{ background-color:var(--surface-2); }
.cal-tg-daycol.drag-over{ background-color:var(--brand-soft); }
.cal-tg-event{ position:absolute; border-radius:6px; padding:3px 6px; font-size:11px; overflow:hidden; border-left:3px solid var(--brand); background:var(--brand-soft); cursor:pointer; line-height:1.3; }
.cal-tg-event[draggable="true"]{ cursor:grab; }
.cal-tg-event.dragging{ opacity:.4; }
.cal-tg-event:hover{ filter:brightness(0.97); }
.cal-tg-event.due{ background:var(--danger-soft); border-left-color:var(--danger); }
.cal-tg-event.internal{ background:var(--gold-soft); }
.cal-tg-event.internal.due{ background:var(--danger-soft); }
.cal-tg-event .t{ font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cal-tg-now{ position:absolute; left:0; right:0; height:0; border-top:2px solid var(--danger); z-index:5; pointer-events:none; }
.cal-tg-now::before{ content:''; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--danger); }
.notif-panel{ position:absolute; top:44px; right:0; width:330px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow-2); padding:8px; z-index:50; max-height:400px; overflow-y:auto; }
.notif-item{ padding:9px 10px; border-radius:8px; }
.notif-item:hover{ background:var(--surface-2); }
.notif-empty{ padding:20px; text-align:center; color:var(--ink-soft); font-size:13px; }
.client-picker{ position:relative; }
.client-picker-input-wrap{ display:flex; align-items:center; gap:7px; border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:var(--surface-2); }
.client-picker-input-wrap input{ border:none; background:transparent; outline:none; width:100%; color:var(--ink); }
.client-picker-results{ position:absolute; top:100%; left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-top:4px; box-shadow:var(--shadow-2); max-height:220px; overflow-y:auto; z-index:20; }
.client-picker-result{ display:block; width:100%; text-align:left; padding:9px 11px; border:none; background:none; font-size:13px; color:var(--ink); border-bottom:1px solid var(--border); }
.client-picker-result:last-child{ border-bottom:none; }
.client-picker-result:hover{ background:var(--surface-2); }
.client-picker-empty{ padding:12px; text-align:center; color:var(--ink-faint); font-size:12.5px; }
.client-picker-selected{ display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--border); border-radius:8px; padding:9px 11px; background:var(--brand-soft); }

table{ width:100%; border-collapse:collapse; background:var(--surface); border-radius:10px; overflow:hidden; }
th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
th{ background:var(--surface-2); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink-soft); font-weight:700; }
tr:last-child td{ border-bottom:none; }
tr.row-inactive{ opacity:.55; }
.section-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
.section-card h3{ font-size:15px; margin-bottom:12px; }
.settings-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.inline-add{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.inline-add input[type=text]{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface-2); }
.tag-list{ display:flex; flex-wrap:wrap; gap:8px; }
.tag-list .chip-x{ display:flex; align-items:center; gap:6px; }
.tag-list .chip-x button{ background:rgba(255,255,255,.35); border:none; border-radius:50%; width:15px;height:15px; font-size:10px; line-height:1; color:inherit; }
.list-plain{ display:flex; flex-wrap:wrap; gap:8px; }
.list-plain .item-x{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); padding:5px 10px; border-radius:20px; font-size:12.5px; }
.list-plain .item-x button{ background:none;border:none;color:var(--ink-faint); font-weight:700; }
.hint{ font-size:12px; color:var(--ink-faint); margin-top:8px; }
#print-report{ display:none; }
.topbar-hamburger{ display:none; width:38px; height:38px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); align-items:center; justify-content:center; flex:0 0 auto; font-size:18px; }
.sidebar-backdrop{ position:fixed; inset:0; background:rgba(15,20,17,.45); z-index:290; }
@media (max-width:820px){
  .shell{ position:relative; }
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; z-index:300; width:250px;
    transform:translateX(-100%); transition:transform .22s ease; box-shadow:none;
  }
  .sidebar.open{ transform:translateX(0); box-shadow:var(--shadow-2); }
  .topbar-hamburger{ display:flex; }
  .topbar{ padding:12px 14px; gap:10px; flex-wrap:wrap; }
  .topbar h2{ font-size:16px; }
  .topbar-title{ min-width:0; overflow:hidden; }
  .topbar-title h2{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar-right{ margin-left:0; }
  .search-box{ min-width:0; flex:1 1 140px; }
  .view{ padding:14px 12px 32px; }
  .field-row{ flex-direction:column; gap:13px; }
  .modal{ max-width:calc(100vw - 24px); max-height:88vh; overflow-y:auto; padding:18px 16px 18px; }
  .overlay{ padding:4vh 8px; }
  .notif-panel{ width:min(320px, calc(100vw - 24px)); right:-6px; }
  .row-actions{ gap:8px; flex-wrap:wrap; }
  .btn-sm{ padding:7px 11px; }
  .list-col{ width:230px; flex:0 0 230px; }
  .list-add-col{ width:180px; flex:0 0 180px; }
  .cal-tg-inner{ min-width:560px; }
  .balance-box{ flex-wrap:wrap; }
  .card-modal-meta{ gap:8px; }
  .settings-tabs .btn{ padding:7px 10px; font-size:12.5px; }
  .cal-toolbar .btn-sm{ padding:7px 10px; font-size:12px; }
}
@media (max-width:480px){
  .list-col{ width:78vw; flex:0 0 78vw; }

function renderLoginScreen(errorMsg){

  const userEl = document.getElementById('login-user');

  const u = (userEl.value||'').trim().toLowerCase();

  if(!u || !p){

    setStoredUser({
      username: analyst.username,

      analystId: analyst.id,
      isAdmin: !!analyst.isAdmin

  }
  document.getElementById('app').innerHTML = renderLoginScreen('Usuário ou senha inválidos. Tente novamente.');

function ensureAdminAnalyst(s){
  let admin = s.analysts.find(a=> a.isAdmin);

function normalizeState(raw){
  let s = raw;
  if(!s || typeof s!=='object') s = defaultState();
  ['analysts','boards','clients','cards','schedules','productTags','modules','screens','agendaTypes'].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=defaultState()[k]; });

    const copy = Object.assign({}, a);

    if(!copy.password) copy.password = '';
    if(copy.isAdmin===undefined) copy.isAdmin = false;

  });

  s = ensureAdminAnalyst(s);
  return s;

async function refreshFromCloudIfChanged(source){
  if(!sbClient || cloudStatus!=='connected') return false;
  if(realtimeRefreshInFlight){
    realtimeRefreshQueued = true;
    return false;
  }
  const now = Date.now();
  if(now - realtimeLastRefreshAt < REALTIME_MIN_REFRESH_GAP_MS) return false;

  realtimeRefreshInFlight = true;
  realtimeLastRefreshAt = now;
  let changed = false;
  try{
    const {data, error} = await sbClient.from('app_state')
      .select('data, updated_at').eq('id', 1).maybeSingle();
    if(error) throw error;
    if(!data || !data.data || !data.updated_at) return false;
    if(sameInstant(data.updated_at, lastKnownUpdatedAt)) return false;

    const remote = normalizeState(data.data);
    if(saveStatus==='pending' || saveStatus==='saving'){
      state = mergeStates(remote, state);
    }else{
      state = remote;
    }
    lastKnownUpdatedAt = data.updated_at;
    saveStatus = 'saved';
    changed = true;

    renderWithoutPersist();
    flashLiveUpdate();
    showLiveSyncIndicator();
    updateSaveStatusLine();
  }catch(e){
    console.warn('Falha na atualização em tempo real', source || 'refresh', e);
  }finally{
    realtimeRefreshInFlight = false;
    if(realtimeRefreshQueued){
      realtimeRefreshQueued = false;
      setTimeout(()=>refreshFromCloudIfChanged('queued'), 0);
    }
  }
  return changed;
}

function stopRealtimeSync(){
  if(realtimeChannel && sbClient){
    try{ sbClient.removeChannel(realtimeChannel); }catch(e){}
  }
  realtimeChannel = null;
  if(realtimePollTimer){ clearInterval(realtimePollTimer); realtimePollTimer = null; }
}

function startRealtimeSync(){
  stopRealtimeSync();
  if(!sbClient || cloudStatus!=='connected') return;

  try{
    realtimeChannel = sbClient.channel('implanta-app-state-live')
      .on('postgres_changes',
        {event:'UPDATE',schema:'public',table:'app_state',filter:'id=eq.1'},
        payload=>{
          const updatedAt = payload && payload.new ? payload.new.updated_at : null;
          if(updatedAt && !sameInstant(updatedAt, lastKnownUpdatedAt)){
            refreshFromCloudIfChanged('realtime');
          }
        })
      .subscribe(status=>{
        if(status==='SUBSCRIBED') console.info('Sincronização em tempo real ativa.');
      });
  }catch(e){
    console.warn('Não foi possível iniciar a sincronização em tempo real', e);
  }

  realtimePollTimer = setInterval(()=>{
    if(document.visibilityState==='visible') refreshFromCloudIfChanged('poll');
  }, REALTIME_POLL_MS);
}

  if(cloudStatus==='connected' && sbClient){

    saveTimer = setTimeout(cloudSave, 800);

function sameInstant(a, b){
  if(!a || !b) return false;
  const ta = new Date(a).getTime(), tb = new Date(b).getTime();
  if(isNaN(ta) || isNaN(tb)) return false;
  return Math.abs(ta - tb) < 1000;
}
async function cloudSave(){
  if(!sbClient) return;
  saveStatus = 'saving';
  updateSaveStatusLine();
  try{
    const { data: fresh, error: fetchErr } = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
    if(fetchErr) throw fetchErr;
    if(fresh && fresh.updated_at && !sameInstant(fresh.updated_at, lastKnownUpdatedAt) && fresh.data){
      state = mergeStates(normalizeState(fresh.data), state);
    }
    const nowIso = new Date().toISOString();
    const { error } = await sbClient.from('app_state').update({data: state, updated_at: nowIso}).eq('id', 1);
    if(error) throw error;
    lastKnownUpdatedAt = nowIso;
    saveStatus = 'saved';
  }catch(e){
    console.warn('Falha ao salvar na nuvem', e);
    saveStatus = 'error';
  }
  updateSaveStatusLine();
}
function mergeStates(remote, local){
  const merged = Object.assign({}, local);
  ['analysts','boards','clients','cards','schedules','productTags','modules','agendaTypes','screens'].forEach(key=>{
    const byIdMap = new Map();
    (remote[key]||[]).forEach(item=> byIdMap.set(item.id, item));
    (local[key]||[]).forEach(item=> byIdMap.set(item.id, item));
    merged[key] = [...byIdMap.values()];
  });
  return dedupeRegistries(merged);
}
function dedupeRegistries(s){
  function dedupeWithRemap(arr){
    const survivorByName = new Map();
    const remap = new Map();
    (arr||[]).forEach(item=>{
      if(survivorByName.has(item.name)){ remap.set(item.id, survivorByName.get(item.name).id); }
      else { survivorByName.set(item.name, item); }
    });
    return { deduped:[...survivorByName.values()], remap };
  }
  const modResult = dedupeWithRemap(s.modules);
  s.modules = modResult.deduped;
  (s.screens||[]).forEach(scr=>{ if(modResult.remap.has(scr.moduleId)) scr.moduleId = modResult.remap.get(scr.moduleId); });
  s.agendaTypes = dedupeWithRemap(s.agendaTypes).deduped;
  const seenScreens = new Map();
  (s.screens||[]).forEach(scr=>{
    const key = scr.name+'::'+scr.moduleId;
    if(!seenScreens.has(key)) seenScreens.set(key, scr);
  });
  s.screens = [...seenScreens.values()];
  return s;
}

async function connectCloud(url, anonKey){
  cloudConfig = {url, anonKey};
  usingDefaultCloud = (url===DEFAULT_CLOUD_CONFIG.url && anonKey===DEFAULT_CLOUD_CONFIG.anonKey);
  localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
  localStorage.removeItem(CLOUD_DISABLED_KEY);
  cloudStatus = 'connecting'; cloudErrorMsg=''; render();
  await boot();
}
function disconnectCloud(){
  stopRealtimeSync();
  cloudConfig = null; sbClient = null; cloudStatus = 'local'; cloudErrorMsg=''; usingDefaultCloud = false;
  localStorage.removeItem(CLOUD_CONFIG_KEY);
  localStorage.setItem(CLOUD_DISABLED_KEY, '1');
  render();
}
async function boot(){
  if(!currentUser){
    document.getElementById('app').innerHTML = renderLoginScreen();
    return;
  }
  let needsImmediateResave = false;
  if(cloudConfig && window.supabase){
    try{
      sbClient = window.supabase.createClient(cloudConfig.url, cloudConfig.anonKey);
      const { data, error } = await sbClient.from('app_state').select('data, updated_at').eq('id', 1).maybeSingle();
      if(error) throw error;
      if(data && data.data){
        const before = data.data;
        const beforeCounts = {
          modules: Array.isArray(before.modules) ? before.modules.length : 0,
          agendaTypes: Array.isArray(before.agendaTypes) ? before.agendaTypes.length : 0,
          screens: Array.isArray(before.screens) ? before.screens.length : 0,
          analysts: Array.isArray(before.analysts) ? before.analysts.length : 0
        };
        state = normalizeState(before);
        lastKnownUpdatedAt = data.updated_at || null;
        if(state.modules.length < beforeCounts.modules || state.agendaTypes.length < beforeCounts.agendaTypes || state.screens.length < beforeCounts.screens || state.analysts.length > beforeCounts.analysts){
          needsImmediateResave = true;
        }
      } else {
        state = loadLocalState();
        const nowIso = new Date().toISOString();
        const ins = await sbClient.from('app_state').insert({id:1, data: state, updated_at: nowIso});
        if(ins.error) throw ins.error;
        lastKnownUpdatedAt = nowIso;
      }
      cloudStatus = 'connected';
      startRealtimeSync();
    }catch(e){
      console.warn('Falha ao conectar à nuvem', e);
      cloudStatus = 'error';
      const detail = (e && (e.message || e.error_description || e.hint || e.details)) || 'erro desconhecido';
      cloudErrorMsg = 'Não foi possível conectar ao banco na nuvem. Usando os dados salvos neste navegador por enquanto.\nDetalhe técnico: '+detail;
      sbClient = null;
      state = loadLocalState();
    }
  } else {
    state = loadLocalState();
  }
  render();
  if(needsImmediateResave && sbClient){
    await cloudSave();
  }
}

/* ============================= HELPERS ============================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function startOfWeekISO(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); const wd=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-wd); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
const WD_NAMES = ['seg','ter','qua','qui','sex','sáb','dom'];
function weekdayShort(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return WD_NAMES[(dt.getDay()+6)%7]; }
function fmtDT(ts){ const d=new Date(ts); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function minToHM(min){ const sign = min<0?'-':''; min=Math.abs(Math.round(min)); const h=Math.floor(min/60), m=min%60; return sign + h + 'h' + (m>0? String(m).padStart(2,'0')+'m':''); }
function byId(arr,id){ return arr.find(x=>x.id===id); }
function captureFormValues(form){
  const fd = new FormData(form);
  const multiNames = new Set();
  form.querySelectorAll('input[type=checkbox]').forEach(cb=> multiNames.add(cb.name));
  const values = {};
  multiNames.forEach(n=> values[n] = fd.getAll(n));
  for(const [k,v] of fd.entries()){ if(!multiNames.has(k)) values[k] = v; }
  return values;
}

function cardUsedMinutes(card){ return state.schedules.filter(s=>s.cardId===card.id && s.status==='concluida').reduce((sum,s)=> sum + (s.deductMinutes!=null ? s.deductMinutes : (timeToMin(s.endTime)-timeToMin(s.startTime))), 0); }

function deleteAnalyst(id){
  const target = getAnalyst(id);

function moveCard(cardId, targetListId){
  const card = getCard(cardId); if(!card) return;
  const board = getBoard(card.boardId); if(!board) return;
  const oldList = board.lists.find(l=>l.id===card.listId);
  const newList = board.lists.find(l=>l.id===targetListId);
  if(oldList && newList && oldList.id!==newList.id){
    card.listId = targetListId;
    addHistory(card, `Movido de "${oldList.name}" para "${newList.name}"`);
  }
}

  state.schedules = state.schedules.filter(x=>x.id!==id);
}
function completeSchedule(id, status, notes, deductMinutes){
  const s = state.schedules.find(x=>x.id===id); if(!s) return;
  s.status = status; s.completionNotes = notes||'';
  s.deductMinutes = (deductMinutes!=null && deductMinutes!=='') ? Number(deductMinutes) : null;
  if(s.cardId){
    const card = getCard(s.cardId);
    if(card){
      const stLabel = status==='concluida'?'Concluído': status==='nao_realizada'?'Não realizada':'Pendente';
      addHistory(card, `Agendamento de ${fmtDateBR(s.date)} marcado como "${stLabel}". Obs: ${notes||'nenhuma'}`);
    }
  }
}

function renderBoardView(){
  if(ui.currentBoardId==='all'){

  const analyst = getAnalyst(board.analystId);
  const cards = cardsInBoard(board.id);

  return `<div class="board-lists">
    ${board.lists.map(list=>{
      const listCards = cards.filter(c=>c.listId===list.id);
      return `<div class="list-col" ondragover="event.preventDefault();this.classList.add('drag-over');" ondragleave="this.classList.remove('drag-over');" ondrop="handleDropCard(event, '${board.id}', '${list.id}')">
        <div class="list-head">
          <span class="name">${esc(list.name)}</span>
          <span class="count">${listCards.length}</span>

      </div>`;
    }).join('')}
  </div>`;
}

function renderUnifiedBoardView(){
  let targetAnalysts = activeAnalysts();
  if(ui.boardAnalystFilter !== 'all'){
    targetAnalysts = targetAnalysts.filter(a=> a.id === ui.boardAnalystFilter);
  }

  const standardListNames = ['Fila / Cadastro', 'Em implantação', 'Treinamento', 'Concluído'];
  const totalCards = state.cards.filter(c=>{
    const b = getBoard(c.boardId);
    if(!b) return false;
    const a = getAnalyst(b.analystId);
    if(!a || a.inactive) return false;
    if(ui.boardAnalystFilter !== 'all' && a.id !== ui.boardAnalystFilter) return false;
    return true;
  }).length;

  return `<div class="unified-board">
    <div class="board-summary">
      <div class="board-summary-main">
        <strong>Visão Unificada de Quadros</strong>
        <span>(${totalCards} cards em ${targetAnalysts.length} analista(s) ativo(s))</span>
      </div>
      <select class="board-analyst-filter" onchange="ui.boardAnalystFilter=this.value;render();">
        <option value="all" ${ui.boardAnalystFilter==='all'?'selected':''}>Todos os analistas</option>
        ${state.analysts.map(a=> `<option value="${a.id}" ${ui.boardAnalystFilter===a.id?'selected':''}>${esc(a.name)}${a.inactive?' (Inativo)':''}</option>`).join('')}
      </select>
    </div>

    <div class="board-lists">
      ${standardListNames.map(stdName=>{
        const matchingCards = [];
        targetAnalysts.forEach(a=>{
          const b = boardOfAnalyst(a.id);
          if(!b) return;
          const matchedList = b.lists.find(l=> l.name.trim().toLowerCase() === stdName.toLowerCase());
          if(matchedList){
            const cardsInThisList = state.cards.filter(c=> c.boardId === b.id && c.listId === matchedList.id);
            cardsInThisList.forEach(c=> matchingCards.push({card: c, analyst: a, list: matchedList}));
          }
        });

        return `<div class="list-col">
          <div class="list-head">
            <span class="name">${esc(stdName)}</span>
            <span class="count">${matchingCards.length}</span>
          </div>
          <div class="list-cards">
            ${matchingCards.length===0 ? `<div style="font-size:12px;color:var(--ink-faint);padding:12px 6px;text-align:center;">Nenhum card nesta etapa</div>` : ''}
            ${matchingCards.map(item => renderCardMini(item.card, item.analyst)).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderCardMini(card, analystOverride){
  const client = getClient(card.clientId);
  const scheds = schedulesForCard(card.id);
  const pending = scheds.some(s=> scheduleIsDue(s));
  const bal = cardBalanceHours(card);
  const tags = (card.productTags||[]).map(tid=> byId(state.productTags, tid)).filter(Boolean);
  const board = getBoard(card.boardId);
  const analyst = analystOverride || (board ? getAnalyst(board.analystId) : null);

  return `<div class="card-mini" draggable="true" ondragstart="handleDragCardStart(event, '${card.id}')" onclick="ui.openCardId='${card.id}';render()">
    ${analyst ? `
      <div class="analyst-meta" style="color:${analyst.color||'var(--brand)'};display:flex;align-items:center;gap:5px;">
        <span class="analyst-dot" style="background:${analyst.color||'var(--brand)'};"></span>
        ${esc(analyst.name)}
      </div>
    `:''}

    <div class="card-title">${esc(client?client.name:'Cliente não encontrado')}</div>
    
    ${tags.length>0 ? `
      <div class="chip-row">
        ${tags.map(t=> `<span class="chip" style="background:${t.color};">${esc(t.name)}</span>`).join('')}
      </div>
    `:''}

    <div class="card-meta">
      <span class="balance-pill ${bal<0?'neg':''}">${bal.toFixed(1)}h rest.</span>
      ${pending ? `<span class="pending-flag">⚠️ Pendente</span>` : ''}
    </div>
  </div>`;
}

function handleDragCardStart(e, cardId){
  e.dataTransfer.setData('text/plain', cardId);
}
function handleDropCard(e, boardId, listId){
  e.preventDefault();
  const cardId = e.dataTransfer.getData('text/plain');
  if(!cardId) return;
  const card = getCard(cardId);
  if(card && card.boardId===boardId){
    moveCard(cardId, listId);
    persist(); render();
  }
}

function renderCalendarView(){
  const start = ui.calStart;
  const days = [0,1,2,3,4,5,6].map(i=> addDaysISO(start, i));

  let scheds = state.schedules;
  if(ui.calAnalyst!=='all') scheds = scheds.filter(s=> s.analystId===ui.calAnalyst);

    else if(ui.calCategory==='client') scheds = scheds.filter(s=> { const t=state.agendaTypes.find(x=>x.name===s.type); return !t || !t.isInternal; });
  }

  const hours = [];
  for(let h=7; h<=19; h++) hours.push(String(h).padStart(2,'0')+':00');

  return `<div class="calendar-view">
    <div class="cal-toolbar">
      <button class="btn btn-ghost btn-sm" onclick="ui.calStart=addDaysISO(ui.calStart,-7);render();">◀ Semana anterior</button>
      <button class="btn btn-ghost btn-sm" onclick="ui.calStart=startOfWeekISO(todayISO());render();">Hoje</button>

      <div class="grow"></div>

      <select class="btn btn-sm" onchange="ui.calAnalyst=this.value;render();">
        <option value="all" ${ui.calAnalyst==='all'?'selected':''}>Todos os analistas</option>
        ${state.analysts.map(a=> `<option value="${a.id}" ${ui.calAnalyst===a.id?'selected':''}>${esc(a.name)}${a.inactive?' (Inativo)':''}</option>`).join('')}
      </select>

      <select class="btn btn-sm" onchange="ui.calCategory=this.value;render();">
        <option value="all" ${ui.calCategory==='all'?'selected':''}>Todas as categorias</option>
        <option value="client" ${ui.calCategory==='client'?'selected':''}>Apenas Clientes</option>
        <option value="internal" ${ui.calCategory==='internal'?'selected':''}>Apenas Internas</option>
      </select>
    </div>

    <div class="cal-tg-outer">
      <div class="cal-tg-inner">
        <div class="cal-tg-headerrow">
          <div style="padding:8px;font-size:11px;color:var(--ink-faint);text-align:center;">Hora</div>
          ${days.map(d=> {
            const isToday = d===todayISO();
            return `<div class="cal-tg-daycol-head ${isToday?'today':''}">
              <div class="wd">${weekdayShort(d)}</div>
              <div class="dt">${fmtDateBR(d).slice(0,5)}</div>
            </div>`;
          }).join('')}
        </div>

        <div class="cal-tg-bodyscroll">
          <div class="cal-tg-bodyrow" style="--hour-px:50px; height:${13*50}px;">
            <div class="cal-tg-hourlabels">
              ${hours.map((h, idx)=> `<div class="cal-tg-hourlabel" style="top:${idx*50}px;">${h}</div>`).join('')}
            </div>

            ${days.map(d=> {
              const dayScheds = scheds.filter(s=> s.date===d);
              return `<div class="cal-tg-daycol" onclick="openModal('new-schedule',{date:'${d}'})">
                ${dayScheds.map(s=> {
                  const sMin = timeToMin(s.startTime) - 7*60;
                  const eMin = timeToMin(s.endTime) - 7*60;
                  const top = (sMin / 60) * 50;
                  const height = Math.max(22, ((eMin - sMin) / 60) * 50);
                  const client = s.cardId ? getClient(getCard(s.cardId)?.clientId) : (s.clientId ? getClient(s.clientId) : null);
                  const analyst = getAnalyst(s.analystId);
                  const typeObj = state.agendaTypes.find(t=>t.name===s.type);
                  const isInt = typeObj && typeObj.isInternal;
                  const isDue = scheduleIsDue(s);

                  return `<div class="cal-tg-event ${isInt?'internal':''} ${isDue?'due':''}"
                    style="top:${top}px; height:${height}px; border-left-color:${analyst?analyst.color:'var(--brand)'};"
                    onclick="event.stopPropagation();openModal('edit-schedule',{schedId:'${s.id}'})"
                    title="${esc(client?client.name:'Sem cliente')} (${s.startTime}-${s.endTime})">
                    <div class="t">${s.startTime} ${esc(client?client.name:'Sem cliente')}</div>
                    <div style="font-size:10px;opacity:.85;">${esc(s.type)} — ${esc(analyst?analyst.name:'')}</div>
                  </div>`;
                }).join('')}
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

  return `<div class="reports-view">

      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">Resumo das horas contratadas, horas utilizadas em agendamentos concluídos e saldo restante.</p>

            <th>Cliente</th>
            <th>Analista / Quadro</th>

            const cards = cardsForClient(cl.id);
            const totalContracted = cards.reduce((sum,c)=> sum+(c.contractedHours||0), 0);
            const totalUsed = cards.reduce((sum,c)=> sum+(cardUsedMinutes(c)/60), 0);
            const balance = totalContracted - totalUsed;

            /* Calcula horas não abatidas (agendamentos sem card mas concluídos) */
            const nonDeductedScheds = state.schedules.filter(s=> s.clientId===cl.id && !s.cardId && s.status==='concluida');
            const totalNonDeductedMin = nonDeductedScheds.reduce((sum,s)=> sum + (s.deductMinutes!=null ? s.deductMinutes : (timeToMin(s.endTime)-timeToMin(s.startTime))), 0);

            return `<tr>
              <td style="font-weight:700;color:var(--brand-dark);">${esc(cl.name)}</td>

/* ============================= GENERIC MODAL ROUTER ============================= */
function openModal(type, data={}){ ui.modal = {type, data}; render(); }
function closeModal(){ ui.modal = null; ui.formErr = ''; render(); }

function renderModal(){
  if(!ui.modal) return '';
  const {type, data} = ui.modal;

  if(type==='new-card') return renderModalNewCard(data);
  if(type==='new-client' || type==='edit-client') return renderModalClient(type, data);
  if(type==='import-clients') return renderModalImportClients();
  if(type==='new-schedule' || type==='edit-schedule') return renderModalSchedule(type, data);
  if(type==='confirm-schedule') return renderModalConfirmSchedule(data);
  if(type==='new-analyst' || type==='edit-analyst') return renderModalAnalyst(type, data);

  return '';
}

      </div>

      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;">Selecione uma planilha contendo as colunas: Nome Fantasia, Código, CNPJ, Razão Social, Cidade, etc.</p>

      <div class="field">
        <input type="file" id="import-file-input" accept=".xlsx, .xls, .csv">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="handleImportFileProcess()">Processar Ficheiro</button>
      </div>
    </div>
  </div>`;
}

function handleImportFileProcess(){
  const fileInput = document.getElementById('import-file-input');
  if(!fileInput || !fileInput.files[0]) return;
  const file = fileInput.files[0];

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);

      let imported = 0;
      json.forEach(row=>{
        const parsed = parseImportRow(row);
        if(parsed && parsed.name){
          createClient(parsed);
          imported++;
        }
      });

      showAlert(`${imported} clientes importados com sucesso!`);
      persist(); closeModal();
    }catch(err){
      showAlert('Erro ao processar o ficheiro Excel/CSV.');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* Modal Agendamento (Novo / Edição) com a nova regra de negócio para Agenda Interna */
function renderModalSchedule(type, data){
  const isEdit = type==='edit-schedule';

  const defaultDate = data.date || todayISO();
  const card = sched.cardId ? getCard(sched.cardId) : (data.cardId ? getCard(data.cardId) : null);
  const selectedAnalystId = sched.analystId || data.analystId || (currentUser && currentUser.analystId ? currentUser.analystId : state.analysts[0]?.id);

  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header">
        <h3>${isEdit?'Editar Agendamento':'Novo Agendamento'}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      ${ui.formErr ? `<div class="error-msg">${esc(ui.formErr)}</div>` : ''}

      <form onsubmit="event.preventDefault();handleSaveScheduleSubmit('${isEdit?sched.id:''}', this);">
        <div class="field">
          <label>Analista *</label>
          <select name="analystId" required>
            ${activeAnalysts().map(a=> `<option value="${a.id}" ${(selectedAnalystId===a.id)?'selected':''}>${esc(a.name)}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Cliente *</label>
          <select name="clientId" required>
            <option value="">Selecione o cliente...</option>
            ${state.clients.map(c=> {
              const isSelected = (card && card.clientId===c.id) || (sched.clientId===c.id);
              return `<option value="${c.id}" ${isSelected?'selected':''}>${esc(c.name)}</option>`;
            }).join('')}
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Data *</label>
            <input type="date" name="date" value="${sched.date || defaultDate}" required>
          </div>
          <div class="field">
            <label>Início *</label>
            <input type="time" name="startTime" value="${sched.startTime || '09:00'}" required>
          </div>
          <div class="field">
            <label>Fim *</label>
            <input type="time" name="endTime" value="${sched.endTime || '10:00'}" required>
          </div>
        </div>

        <div class="field">
          <label>Tipo de Agenda *</label>
          <select name="type" required>
            ${activeAgendaTypes().map(t=> `<option value="${t.name}" ${sched.type===t.name?'selected':''}>${esc(t.name)}${t.isInternal?'(Interno)':''}</option>`).join('')}
          </select>
        </div>

        <div class="field">
          <label>Módulos Abordados</label>
          <div class="check-grid">
            ${activeModules().map(m=> {
              const checked = (sched.modules||[]).includes(m.name);
              return `<label class="check-pill">
                <input type="checkbox" name="modules" value="${m.name}" ${checked?'checked':''}>${esc(m.name)}
              </label>`;
            }).join('')}
          </div>
        </div>

        <div class="field">
          <label>Observações</label>
          <textarea name="notes" rows="2">${esc(sched.notes||'')}</textarea>
        </div>

        <div class="form-actions">
          ${isEdit ? `<button type="button" class="btn btn-danger btn-sm" style="margin-right:auto;" onclick="confirmDeleteSchedule('${sched.id}')">Excluir</button>` : ''}
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar Agendamento</button>
        </div>
      </form>
    </div>
  </div>`;
}

function confirmDeleteSchedule(id){
  showConfirm('Excluir este agendamento?', ()=>{
    deleteSchedule(id); persist(); closeModal();
  });
}

function handleSaveScheduleSubmit(schedId, form){
  const v = captureFormValues(form);
  if(!v.clientId || !v.analystId || !v.date || !v.startTime || !v.endTime || !v.type){
    ui.formErr = 'Preencha todos os campos obrigatórios (*).'; render(); return;
  }

  /* Conflito de horário */
  if(scheduleConflict(v.analystId, v.date, v.startTime, v.endTime, schedId)){
    ui.formErr = 'Existe um conflito de horário para este analista nesta data.'; render(); return;
  }

  const selectedBoard = boardOfAnalyst(v.analystId);
  const typeObj = state.agendaTypes.find(t=> t.name === v.type);

  let targetCardId = null;

  /* Aplicação das regras de negócio para encontrar/criar card */
  if(selectedBoard){
    const existingCard = state.cards.find(c=> c.clientId === v.clientId && c.boardId === selectedBoard.id);

    if(existingCard){
      targetCardId = existingCard.id;
    } else {
      /* Se for vinculado a uma agenda interna */
      if(typeObj && typeObj.isInternal){
        showConfirm('O cliente selecionado não possui um quadro neste analista. Deseja criar um novo quadro/card para este cliente?', ()=>{
          /* SE SIM: criar o Card e seguir o padrão */
          const newCard = createCard({
            boardId: selectedBoard.id,
            clientId: v.clientId,
            contractedHours: 0
          });
          executeSaveSchedule(schedId, v, newCard ? newCard.id : null);
        }, ()=>{
          /* SE NÃO: não criar o card, mas registar o agendamento (horas não abatidas) */
          executeSaveSchedule(schedId, v, null);
        });
        return;
      } else {
        /* Se for tipo normal e não possui card, cria o card automaticamente conforme fluxo padrão */
        const newCard = createCard({
          boardId: selectedBoard.id,
          clientId: v.clientId,
          contractedHours: 0
        });
        if(newCard) targetCardId = newCard.id;
      }
    }
  }

  executeSaveSchedule(schedId, v, targetCardId);
}

function executeSaveSchedule(schedId, v, cardId){
  const modules = Array.isArray(v.modules) ? v.modules : (v.modules ? [v.modules] : []);

  if(schedId){
    updateSchedule(schedId, {
      analystId: v.analystId, clientId: v.clientId, cardId,
      date: v.date, startTime: v.startTime, endTime: v.endTime,
      type: v.type, modules, notes: v.notes||''
    });
  } else {
    createSchedule({
      analystId: v.analystId, clientId: v.clientId, cardId,
      date: v.date, startTime: v.startTime, endTime: v.endTime,
      type: v.type, modules, notes: v.notes||''
    });
  }

  persist(); closeModal();
}

function handleSaveAnalystSubmit(analystId, form){
  const v = captureFormValues(form);
  if(!v.name){ ui.formErr = 'Preencha o nome do analista.'; render(); return; }

  if(analystId){
    const a = getAnalyst(analystId);
    if(a){
      a.name = v.name;
      a.username = v.username||'';
      a.password = v.password||'';
      a.color = v.color||a.color;
      a.isAdmin = !!v.isAdmin;
    }
  } else {
    createAnalyst(v.name, v.color, v.username, v.password, !!v.isAdmin);
  }

  persist(); closeModal();
}

/* Modal de Confirmação Alerta Geral */
function renderConfirmModal(){
  if(!ui.confirmDialog) return '';
  const {type, message, onYes} = ui.confirmDialog;

  return `<div class="overlay confirm-overlay">
    <div class="modal" style="max-width:420px;text-align:center;">
      <h3 style="margin-bottom:12px;font-size:17px;">${type==='alert'?'Atenção':'Confirmação'}</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;white-space:pre-line;">${esc(message)}</p>

      <div style="display:flex;justify-content:center;gap:10px;">
        ${type==='confirm' ? `
          <button class="btn btn-ghost" onclick="closeConfirm()">Não</button>
          <button class="btn btn-primary" onclick="closeConfirm();if(typeof ui._onYes==='function')ui._onYes();">Sim</button>
        ` : `
          <button class="btn btn-primary" onclick="closeConfirm()">OK</button>
        `}
      </div>
    </div>
  </div>`;
}

function showConfirm(msg, onYes, onNo){
  ui.confirmDialog = {type:'confirm', message:msg};
  ui._onYes = onYes;
  ui._onNo = onNo;
  render();
}

function closeConfirm(){
  const onNo = ui._onNo;
  ui.confirmDialog = null;
  ui._onYes = null;
  ui._onNo = null;
  if(typeof onNo === 'function') onNo();
  render();
}

/* ============================= RENDER INITIALIZATION ============================= */
function render(){
  const app = document.getElementById('app');
  if(!app) return;

  if(!currentUser){
    app.innerHTML = renderLoginScreen();
    return;
  }

  app.innerHTML = renderShell();
}

/* Boot inicial */
getStoredUser();
boot();
